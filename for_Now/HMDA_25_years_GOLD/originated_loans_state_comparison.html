<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Originated Loans — State Comparison</title>
  <style>
    :root {
      --cream: #fbf5e6;
      --ink: #302f2a;
      --muted: #777268;
      --line: rgba(48, 47, 42, 0.14);
      --violet: #846acd;
      --green: #9bd980;
      --orange: #e67e32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, select { font: inherit; }

    .page {
      min-height: 100vh;
      padding: 12px 0 24px;
    }

    .layout {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      width: 100%;
    }

    .main {
      min-width: 0;
      flex: 1 1 auto;
    }

    .page-header {
      margin: 0 24px 8px 72px;
      text-align: center;
    }

    .subtitle { display: none; }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 54px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: end;
      gap: 16px 24px;
      margin: 0 18px 4px 72px;
    }

    .duration,
    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .duration {
      grid-column: 3;
      justify-self: end;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field label,
    .state-panel-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    select {
      min-width: 96px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf0;
      color: var(--ink);
    }

    .duration select { width: 112px; }

    .range-to {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .legend {
      grid-column: 2;
      grid-row: 1;
      flex-wrap: wrap;
      justify-content: center;
      justify-self: center;
      column-gap: 24px;
      row-gap: 10px;
      margin: 0;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 20px;
      font-weight: 750;
    }

    .legend-swatch {
      width: 17px;
      height: 17px;
      border-radius: 4px;
      background: var(--color);
    }

    .chart-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    #chart.line-mode rect { display: none; }
    #chart.line-mode .bar-value { display: none; }

    .chart-wrap {
      width: 100%;
      overflow-x: auto;
      padding-top: 0;
    }

    #chart {
      display: block;
      width: 100%;
      min-width: 1100px;
      height: 600px;
      overflow: visible;
    }

    .state-panel {
      position: sticky;
      top: 12px;
      flex: 0 0 224px;
      width: 224px;
      max-height: calc(100vh - 24px);
      margin-right: 12px;
      padding: 14px 10px 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f7f0df;
    }

    .state-panel-top {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      margin: 0 5px 10px;
    }

    .selection-count {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .state-list {
      display: grid;
      gap: 4px;
      max-height: calc(100vh - 112px);
      padding-right: 3px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .state-btn {
      min-width: 0;
      padding: 6px 7px;
      overflow: hidden;
      border: 1px solid rgba(48, 47, 42, 0.12);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.38);
      color: var(--ink);
      cursor: pointer;
      font-size: 19px;
      font-weight: 650;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .state-list .state-btn {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      width: 100%;
    }

    .state-rank {
      color: var(--muted);
      font-size: 9px;
      text-align: right;
    }

    .state-name {
      font-size: 19px;
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .state-total {
      color: var(--muted);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .state-btn.selected .state-rank,
    .state-btn.selected .state-total {
      color: inherit;
      opacity: 0.8;
    }

    .state-btn:hover { border-color: rgba(48, 47, 42, 0.3); }

    .state-btn.selected {
      border-color: var(--selected-color);
      background: var(--selected-color);
      color: var(--selected-text);
    }

    .state-btn.capped:not(.selected) {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .usa-btn {
      width: 100%;
      margin-bottom: 10px;
      font-size: 11px;
      text-align: center;
    }

    .tooltip {
      position: fixed;
      z-index: 10;
      display: none;
      min-width: 170px;
      padding: 9px 11px;
      pointer-events: none;
      border: 1px solid rgba(48, 47, 42, 0.14);
      border-radius: 9px;
      background: rgba(251, 245, 230, 0.97);
      box-shadow: 0 8px 24px rgba(48, 47, 42, 0.15);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
    }

    .tooltip strong { display: block; }

    footer {
      display: none;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .layout { display: block; }
      .toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .duration { margin-left: auto; }
      .state-panel {
        position: static;
        width: auto;
        max-height: none;
        margin: 18px 14px 0;
      }
      .state-list { max-height: 340px; }
      footer { margin-right: 18px; }
    }

    @media (max-width: 600px) {
      .page-header, .toolbar, footer { margin-left: 16px; margin-right: 16px; }
      .toolbar { align-items: stretch; flex-direction: column-reverse; }
      .duration { width: 100%; justify-content: flex-start; margin-left: 0; }
      .legend { width: 100%; justify-content: center; }
      #chart { height: 540px; }
    }
  </style>
</head>

    function formatCount(value) {
      if (value >= 1000000) {
        return (value / 1000000).toFixed(value % 1000000 ? 2 : 0).replace(/0$/, "").replace(/\.0$/, "") + "M";
      }
      if (value >= 1000) return Math.round(value / 1000) + "K";
      return String(value);
    }

    function formatAxis(value) {
      if (value >= 1000000) {
        const decimals = value % 1000000 === 0 ? 0 : value % 100000 === 0 ? 1 : 2;
        return (value / 1000000).toFixed(decimals).replace(/\.0$/, "") + "M";
      }
      return value >= 1000 ? (value / 1000).toFixed(value % 1000 ? 1 : 0) + "K" : String(value);
    }

    function niceScale(maxValue) {
      const rough = Math.max(1, maxValue) / 8;
      const power = Math.pow(10, Math.floor(Math.log10(rough)));
      const fraction = rough / power;
      const niceFraction = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 2.5 ? 2.5 : fraction <= 5 ? 5 : 10;
      const step = niceFraction * power;
      return { step, maximum: Math.ceil(maxValue / step) * step };
    }

        button.className = "state-btn";
        button.dataset.state = state;
        button.title = NAME[state] + " (" + state + ") · " + total.toLocaleString() + " originated loans";
        button.innerHTML = '<span class="state-rank">' + (index + 1) + '</span><span class="state-name">' + NAME[state] + '</span><span class="state-total">' + formatCount(total) + '</span>';
        stateList.appendChild(button);
      });
    }

    function selectState(state) {
      const index = selected.indexOf(state);
      if (index >= 0) {
        if (selected.length === 1) return;
        selected.splice(index, 1);
      } else {
        if (selected.length >= MAX_STATES) return;
        selected.push(state);
      }
      update();
    }

    function totalForState(state) {
      const { from, to } = activeRange();
      return DATA[state].reduce((sum, [year, total, originated]) => {
        return year >= from && year <= to ? sum + originated : sum;
      }, 0);
    }

    function sortSelectedStates() {
      selected.sort((a, b) => {
        return totalForState(b) - totalForState(a) || NAME[a].localeCompare(NAME[b]);
      });
    }

    function updateStateButtons() {
      document.querySelectorAll("[data-state]").forEach((button) => {
        const state = button.dataset.state;
        const index = selected.indexOf(state);
        const isSelected = index >= 0;
        button.classList.toggle("selected", isSelected);
        button.classList.toggle("capped", selected.length >= MAX_STATES && !isSelected);
        if (isSelected) {
          button.style.setProperty("--selected-color", COLORS[index]);
          button.style.setProperty("--selected-text", "#302f2a");
        } else {
          button.style.removeProperty("--selected-color");
          button.style.removeProperty("--selected-text");
        }
      });
      selectionCount.textContent = selected.length + " of " + MAX_STATES;
    }

    function updateLegend() {
      legend.innerHTML = "";
      selected.forEach((state, index) => {
        const item = document.createElement("span");
        item.className = "legend-item";
        item.innerHTML = '<span class="legend-swatch" style="--color:' + COLORS[index] + '"></span>' + NAME[state];
        legend.appendChild(item);
      });
    }

    function activeRange() {
      let from = Number(yearFrom.value);
      let to = Number(yearTo.value);
      if (from > to) [from, to] = [to, from];
      return { from, to };
    }

    function activeSeries() {
      const { from, to } = activeRange();
      return selected.map((state, index) => ({
        state,
        label: NAME[state],
        color: COLORS[index],
        rows: DATA[state].filter(([year]) => year >= from && year <= to).map(([year, total, originated]) => ({ year, value: originated }))
      }));
    }

    function showTooltip(event, state, year, value, color) {
      tooltip.innerHTML = '<strong><span style="color:' + color + '">●</span> ' + NAME[state] + '</strong>' + year + ' · ' + value.toLocaleString() + ' originated loans';
      tooltip.style.display = "block";
      const left = Math.min(window.innerWidth - tooltip.offsetWidth - 12, event.clientX + 14);
      const top = Math.min(window.innerHeight - tooltip.offsetHeight - 12, event.clientY + 14);
      tooltip.style.left = Math.max(8, left) + "px";
      tooltip.style.top = Math.max(8, top) + "px";
    }

    function render() {
      const series = activeSeries();
      const years = series[0]?.rows.map((row) => row.year) || [];
      const values = series.flatMap((item) => item.rows.map((row) => row.value));
      const { step, maximum } = niceScale(Math.max(...values, 1));

      const width = Math.max(1100, chartWrap.clientWidth);
      const height = window.innerWidth <= 600 ? 540 : 600;
      const pad = { left: 72, right: 12, top: 42, bottom: 54 };
      const plotWidth = width - pad.left - pad.right;
      const plotHeight = height - pad.top - pad.bottom;
      const baseline = pad.top + plotHeight;
      const groupWidth = plotWidth / Math.max(1, years.length);
      const groupGap = series.length > 1 ? Math.min(12, groupWidth * 0.18) : 0;
      const barsWidth = groupWidth - groupGap;
      const barWidth = barsWidth / series.length;
      const showValues = series.length === 1 || years.length <= 10;
      const yearFontSize = series.length > 1
        ? (years.length > 15 ? 15 : 16)
        : (years.length > 15 ? 13 : 14);
      const yearFontWeight = series.length > 1 ? 750 : 650;

      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.setAttribute("width", String(width));
      svg.setAttribute("height", String(height));
      svg.classList.toggle("line-mode", lineToggle.checked);
      svg.innerHTML = "";

      for (let tick = step; tick <= maximum + step / 10; tick += step) {
        const y = baseline - (tick / maximum) * plotHeight;
        svg.appendChild(svgNode("line", {
          x1: pad.left, x2: width - pad.right, y1: y, y2: y,
          stroke: "rgba(48,47,42,0.12)", "stroke-width": 1
        }));
        svg.appendChild(svgNode("text", {
          x: pad.left - 10, y: y + 4, "text-anchor": "end",
          fill: "#777268", "font-size": 14, "font-family": "system-ui, sans-serif"
        }, formatAxis(tick)));
      }

      svg.appendChild(svgNode("line", {
        x1: pad.left, x2: width - pad.right, y1: baseline, y2: baseline,
        stroke: "rgba(48,47,42,0.3)", "stroke-width": 1
      }));

      years.forEach((year, yearIndex) => {
        const groupX = pad.left + yearIndex * groupWidth;

        series.forEach((item, stateIndex) => {
          const row = item.rows.find((entry) => entry.year === year);
          if (!row) return;
          const barHeight = (row.value / maximum) * plotHeight;
          const x = groupX + stateIndex * barWidth;
          const y = baseline - barHeight;

          const rect = svgNode("rect", {
            x, y, width: barWidth, height: barHeight,
            fill: item.color, stroke: "rgba(112,110,104,0.22)", "stroke-width": 0.5,
            "vector-effect": "non-scaling-stroke"
          });
          rect.style.cursor = "default";
          rect.addEventListener("mousemove", (event) => showTooltip(event, item.state, year, row.value, item.color));
          rect.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
          rect.appendChild(svgNode("title", {}, item.label + " · " + year + " · " + row.value.toLocaleString()));
          svg.appendChild(rect);

          if (showValues && barHeight > 10) {
            const labelInside = barHeight >= 34;
            const labelColor = "#302f2a";
            svg.appendChild(svgNode("text", {
              x: x + barWidth / 2,
              y: labelInside ? y + 20 : Math.max(16, y - 7),
              "text-anchor": "middle", fill: labelColor,
              "font-size": series.length === 1 ? 15 : 12,
              "font-weight": 800, "font-family": "system-ui, sans-serif",
              class: "bar-value"
            }, formatCount(row.value)));
          }
        });

        const tickEvery = years.length > 15 ? 2 : 1;
        if (yearIndex % tickEvery === 0 || yearIndex === years.length - 1) {
          svg.appendChild(svgNode("text", {
            x: groupX + barsWidth / 2, y: baseline + 22,
            "text-anchor": "middle", fill: "#777268",
            "font-size": 14, "font-weight": 650,
            "font-family": "system-ui, sans-serif"
          }, String(year)));
        }
      });

      if (lineToggle.checked) {
        series.forEach((item, stateIndex) => {
          const points = item.rows.map((row, index) => [
            pad.left + index * groupWidth + groupWidth / 2,
            baseline - (row.value / maximum) * plotHeight
          ]);
          svg.appendChild(svgNode("path", {
            d: points.map(([x, y], index) => (index ? "L" : "M") + x + " " + y).join(" "),
            fill: "none", stroke: item.color, "stroke-width": 4,
            "stroke-linecap": "round", "stroke-linejoin": "round"
          }));
          points.forEach(([x, y], index) => {
            svg.appendChild(svgNode("circle", {
              cx: x, cy: y, r: 5, fill: item.color, stroke: "#302f2a", "stroke-width": 1
            }));
          });
        });
      }
    }

    function update() {
      sortSelectedStates();
      updateStateButtons();
      updateLegend();
      render();
    }

    document.addEventListener("click", (event) => {
      const stateButton = event.target.closest("[data-state]");
      if (stateButton) selectState(stateButton.dataset.state);

    });

    [yearFrom, yearTo].forEach((select) => {
      select.addEventListener("change", () => {
        if (Number(yearFrom.value) > Number(yearTo.value)) {
          if (select === yearFrom) yearTo.value = yearFrom.value;
          else yearFrom.value = yearTo.value;
        }
        buildStates();
        update();
      });
    });
    lineToggle.addEventListener("change", update);

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 100);
    });

    fillYears();
    buildStates();
    update();
  </script>
</body>
</html>
