<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="704" viewBox="0 0 1600 704" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" style="display:block;width:100%;height:auto;max-width:100vw">
  <title id="title">ML Model for Dynamic Pricing</title>
  <desc id="desc">Three cards describing the dynamic pricing model: margin optimization for high-active LOs, re-engagement for low-active and dormant LOs, and individual-level 1:1 dynamic pricing.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F6F4"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B4CCA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15803D"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2410C"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B4CCA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity=".08"/>
    </filter>
    <clipPath id="clip1"><rect x="60" y="190" width="466" height="444" rx="20"/></clipPath>
    <clipPath id="clip2"><rect x="567" y="190" width="466" height="444" rx="20"/></clipPath>
    <clipPath id="clip3"><rect x="1074" y="190" width="466" height="444" rx="20"/></clipPath>
    <style>
      text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
             text-rendering: geometricPrecision; shape-rendering: geometricPrecision; }
      .head      { font-size: 50px; font-weight: 700; fill: #12100C; letter-spacing: -0.8px; }
      .card-title{ font-size: 25px; font-weight: 700; fill: #12100C; letter-spacing: -0.3px; }
      .body      { font-size: 22px; font-weight: 400; fill: #45413B; }
      .b         { font-weight: 700; fill: #12100C; }
      .tag       { font-size: 14px; font-weight: 700; letter-spacing: 1.6px; }
    </style>
  </defs>

  <rect width="1600" height="704" fill="url(#bg)"/>

  <!-- ===================== HEADLINE ===================== -->
  <text x="60" y="100" class="head">ML Model for <tspan fill="url(#headGrad)">Dynamic Pricing</tspan></text>
  <line x1="60" y1="142" x2="1540" y2="142" stroke="#E4E2DD" stroke-width="2"/>

  <!-- ===================== CARD 1 — HIGH-ACTIVE ===================== -->
  <g filter="url(#cardShadow)">
    <g clip-path="url(#clip1)">
      <rect x="60" y="190" width="466" height="444" fill="#FBFEFC"/>
      <rect x="60" y="190" width="466" height="6" fill="url(#bar1)"/>
    </g>
  </g>
  <rect x="60" y="190" width="466" height="444" rx="20" fill="none" stroke="#E3EAE5" stroke-width="1.5"/>

  <rect x="94" y="232" width="50" height="50" rx="15" fill="#DCFCE7"/>
  <path d="M106 267 L117 254 L125 261 L136 246" fill="none" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M129 246 H136 V253" fill="none" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="158" y="266" class="card-title">High-Active LOs</text>

  <text x="94" y="340" class="body">Find the <tspan class="b">maximum lender-margin</tspan></text>
  <text x="94" y="374" class="body"><tspan class="b">increase</tspan> that still protects</text>
  <text x="94" y="408" class="body"><tspan class="b">closing probability</tspan> and the</text>
  <text x="94" y="442" class="body">long-term broker relationship.</text>

  <rect x="94" y="520" width="398" height="5" rx="2.5" fill="#EAE8E3"/>
  <rect x="94" y="520" width="310" height="5" rx="2.5" fill="url(#bar1)"/>
  <rect x="94" y="550" width="267" height="42" rx="21" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="228" y="576" text-anchor="middle" class="tag" fill="#15803D">MARGIN OPTIMIZATION</text>

  <!-- ===================== CARD 2 — LOW-ACTIVE &amp; DORMANT ===================== -->
  <g filter="url(#cardShadow)">
    <g clip-path="url(#clip2)">
      <rect x="567" y="190" width="466" height="444" fill="#FFFDFA"/>
      <rect x="567" y="190" width="466" height="6" fill="url(#bar2)"/>
    </g>
  </g>
  <rect x="567" y="190" width="466" height="444" rx="20" fill="none" stroke="#F0E6D9" stroke-width="1.5"/>

  <rect x="601" y="232" width="50" height="50" rx="15" fill="#FFEDD5"/>
  <path d="M613 251 H635" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
  <path d="M630 246 L637 251 L630 256" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M639 264 H617" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
  <path d="M622 259 L615 264 L622 269" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="665" y="266" class="card-title">Low-Active &amp; Dormant LOs</text>

  <text x="601" y="340" class="body">Identify the <tspan class="b">minimum incentive</tspan></text>
  <text x="601" y="374" class="body">needed to produce a <tspan class="b">meaningful</tspan></text>
  <text x="601" y="408" class="body"><tspan class="b">uplift in re-engagement</tspan></text>
  <text x="601" y="442" class="body">without over-subsidizing.</text>

  <rect x="601" y="520" width="398" height="5" rx="2.5" fill="#EAE8E3"/>
  <rect x="601" y="520" width="247" height="5" rx="2.5" fill="url(#bar2)"/>
  <rect x="601" y="550" width="198" height="42" rx="21" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="700" y="576" text-anchor="middle" class="tag" fill="#C2410C">RE-ENGAGEMENT</text>

  <!-- ===================== CARD 3 — 1:1 DYNAMIC PRICING ===================== -->
  <g filter="url(#cardShadow)">
    <g clip-path="url(#clip3)">
      <rect x="1074" y="190" width="466" height="444" fill="#FCFBFF"/>
      <rect x="1074" y="190" width="466" height="6" fill="url(#bar3)"/>
    </g>
  </g>
  <rect x="1074" y="190" width="466" height="444" rx="20" fill="none" stroke="#E4E2F2" stroke-width="1.5"/>

  <rect x="1108" y="232" width="50" height="50" rx="15" fill="#EDE9FE"/>
  <circle cx="1133" cy="257" r="12" fill="none" stroke="#5B21B6" stroke-width="2.6"/>
  <circle cx="1133" cy="257" r="6.5" fill="none" stroke="#5B21B6" stroke-width="2.6"/>
  <circle cx="1133" cy="257" r="2.6" fill="#5B21B6"/>
  <text x="1172" y="266" class="card-title">1:1 Dynamic Pricing</text>

  <text x="1108" y="340" class="body"><tspan class="b">Surgical strikes</tspan> over peanut</text>
  <text x="1108" y="374" class="body">butter spread — individualized</text>
  <text x="1108" y="408" class="body">pricing per LO based on</text>
  <text x="1108" y="442" class="body">behavior, volume, and predicted</text>
  <text x="1108" y="476" class="body">sensitivity.</text>

  <rect x="1108" y="520" width="398" height="5" rx="2.5" fill="#EAE8E3"/>
  <rect x="1108" y="520" width="398" height="5" rx="2.5" fill="url(#bar3)"/>
  <rect x="1108" y="550" width="232" height="42" rx="21" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="1224" y="576" text-anchor="middle" class="tag" fill="#5B21B6">INDIVIDUAL-LEVEL</text>
</svg>
