<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excel Content Wireframe</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --line: #dfe4ec;
        --text: #1f2736;
        --muted: #667389;
        --faint: #8c97aa;
        --accent: #c43dff;
        --accent-soft: rgba(196, 61, 255, 0.12);
        --pink-soft: rgba(255, 83, 173, 0.12);
        --blue-soft: rgba(43, 109, 243, 0.1);
        --gold-soft: rgba(255, 183, 77, 0.16);
        --shadow-soft: 0 20px 44px rgba(64, 31, 95, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Lato", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
      }

      .mobile-bar {
        display: none;
      }

      .shell {
        width: min(1420px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr) 280px;
        background: var(--surface);
      }

      .sidebar,
      .toc {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100vh;
        overflow: auto;
        background: var(--surface);
      }

      .sidebar {
        padding: 30px 22px 28px 28px;
        border-right: 1px solid var(--line);
      }

      .toc {
        padding: 18px 24px 28px;
      }

      .brand {
        margin-bottom: 28px;
      }

      .brand-title {
        display: flex;
        flex-direction: column;
        gap: 1px;
        line-height: 0.92;
      }

      .brand-word {
        display: block;
        font-size: 1.58rem;
        font-weight: 700;
        letter-spacing: -0.05em;
        text-transform: capitalize;
      }

      .brand-word.accent {
        color: var(--accent);
        font-style: italic;
      }

      .sidebar h2,
      .toc h2 {
        margin: 0 0 10px;
        font-size: 1rem;
        font-weight: 400;
      }

      .section-nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .section-link {
        display: block;
        padding: 4px 0;
        color: var(--muted);
        line-height: 1.2;
      }

      .section-link.active {
        color: var(--accent);
      }

      .section-link .number {
        display: inline-block;
        width: 18px;
      }

      .main {
        padding: 30px 56px 64px;
        min-width: 0;
        background:
          radial-gradient(circle at top left, rgba(196, 61, 255, 0.08), transparent 28%),
          radial-gradient(circle at 85% 16%, rgba(255, 83, 173, 0.08), transparent 24%),
          #ffffff;
      }

      .article {
        max-width: 800px;
      }

      .topic-code {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 58px;
        min-height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(196, 61, 255, 0.14), rgba(255, 83, 173, 0.12));
        color: #8a2cbd;
        font-size: 0.86rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .article h1 {
        margin: 18px 0 0;
        font-size: clamp(2.7rem, 4vw, 3.8rem);
        line-height: 0.98;
        font-weight: 700;
        letter-spacing: -0.05em;
      }

      .lede {
        margin: 20px 0 0;
        padding: 18px 22px;
        border: 1px solid rgba(196, 61, 255, 0.16);
        border-left: 4px solid rgba(196, 61, 255, 0.7);
        border-radius: 20px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(252, 246, 255, 0.96));
        box-shadow: var(--shadow-soft);
        color: #4f5d75;
        font-size: 1.03rem;
        line-height: 1.78;
        white-space: pre-line;
      }

      .section-deck {
        display: grid;
        gap: 18px;
        margin-top: 22px;
      }

      .info-card {
        position: relative;
        padding: 20px 22px 22px;
        border: 1px solid rgba(221, 226, 236, 0.95);
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(250, 249, 255, 0.96));
        box-shadow: var(--shadow-soft);
        overflow: hidden;
      }

      .info-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 5px;
        border-radius: 24px;
        background: rgba(196, 61, 255, 0.45);
      }

      .info-card.tone-layman::before {
        background: rgba(196, 61, 255, 0.68);
      }

      .info-card.tone-example::before {
        background: rgba(255, 83, 173, 0.72);
      }

      .info-card.tone-technical::before {
        background: rgba(43, 109, 243, 0.7);
      }

      .info-card.tone-overview::before {
        background: rgba(255, 183, 77, 0.78);
      }

      .info-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #7c2ea8;
        background: var(--accent-soft);
      }

      .info-card.tone-example .info-label {
        color: #b33674;
        background: var(--pink-soft);
      }

      .info-card.tone-technical .info-label {
        color: #2456c8;
        background: var(--blue-soft);
      }

      .info-card.tone-technical {
        border-color: rgba(182, 206, 250, 0.95);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(244, 249, 255, 0.97));
      }

      .info-card.tone-overview .info-label {
        color: #a26913;
        background: var(--gold-soft);
      }

      .info-label::before {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: inset 0 0 0 1px rgba(124, 46, 168, 0.12);
        color: currentColor;
        content: "O";
        font-size: 0.64rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      .info-card.tone-layman .info-label::before {
        content: "L";
      }

      .info-card.tone-example .info-label::before {
        content: "E";
      }

      .info-card.tone-technical .info-label::before {
        content: "T";
      }

      .info-card p {
        margin: 16px 0 0;
        color: #4f5d75;
        font-size: 1rem;
        line-height: 1.82;
        white-space: pre-line;
      }

      .info-card.tone-technical p {
        color: #334767;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-size: 1.06rem;
        line-height: 1.94;
        letter-spacing: 0.005em;
      }

      .upload-tools {
        display: flex;
        justify-content: flex-start;
        margin-bottom: 18px;
      }

      .upload-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid #cfd7e4;
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
      }

      .upload-label:hover {
        border-color: #aeb8c9;
      }

      .upload-label input {
        display: none;
      }

      .toc-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .toc-link {
        display: block;
        padding: 4px 0 4px 10px;
        border-left: 2px solid transparent;
        color: var(--muted);
        line-height: 1.2;
      }

      .toc-link + .toc-link {
        margin-top: 4px;
      }

      .toc-link.active {
        border-left-color: var(--accent);
        color: var(--accent);
      }

      .toc-link .toc-number {
        display: inline-block;
        min-width: 34px;
      }

      .backdrop {
        display: none;
      }

      @media (max-width: 1040px) {
        .mobile-bar {
          position: sticky;
          top: 0;
          z-index: 20;
          display: flex;
          align-items: center;
          gap: 12px;
          height: 52px;
          padding: 0 14px;
          border-bottom: 1px solid var(--line);
          background: rgba(255, 255, 255, 0.94);
          backdrop-filter: blur(12px);
        }

        .mobile-toggle {
          width: 34px;
          height: 34px;
          border: 0;
          border-radius: 8px;
          background: transparent;
          color: var(--muted);
          cursor: pointer;
        }

        .mobile-toggle svg {
          width: 18px;
          height: 18px;
        }

        .mobile-title strong {
          display: block;
          font-size: 0.95rem;
        }

        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: fixed;
          top: 52px;
          left: 0;
          bottom: 0;
          width: min(84vw, 290px);
          z-index: 25;
          transform: translateX(-102%);
          transition: transform 0.22s ease;
        }

        body.nav-open .sidebar {
          transform: translateX(0);
        }

        .toc {
          display: none;
        }

        .main {
          padding: 24px 20px 40px;
        }

        .article {
          max-width: none;
        }

        .article h1 {
          margin-top: 16px;
        }

        .backdrop {
          position: fixed;
          inset: 52px 0 0;
          z-index: 15;
          display: block;
          opacity: 0;
          pointer-events: none;
          background: rgba(12, 19, 31, 0.22);
          transition: opacity 0.22s ease;
        }

        body.nav-open .backdrop {
          opacity: 1;
          pointer-events: auto;
        }
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  </head>
  <body>
    <header class="mobile-bar">
      <button class="mobile-toggle" id="menuToggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"></path>
        </svg>
      </button>
      <div class="mobile-title">
        <strong id="mobileContextTitle">Solar System</strong>
      </div>
    </header>

    <div class="backdrop" id="backdrop"></div>

    <div class="shell">
      <aside class="sidebar">
        <div class="brand" id="brandTitle"></div>

        <h2>Chapters</h2>
        <nav class="section-nav" id="sectionNav"></nav>
      </aside>

      <main class="main">
        <article class="article">
          <div class="topic-code" id="articleEyebrow"></div>
          <h1 id="articleTitle"></h1>
          <p class="lede" id="articleLede"></p>
          <div class="section-deck" id="sectionDeck"></div>
        </article>
      </main>

      <aside class="toc">
        <div class="upload-tools">
          <label class="upload-label">
            Upload Excel
            <input id="excelUpload" type="file" accept=".xlsx,.xls" />
          </label>
        </div>

        <h2>Topics</h2>
        <ul class="toc-list" id="itemNav"></ul>
      </aside>
    </div>

    <script>
      const demoRows = [
        {
          chapter: "Planets",
          subtopic: "Mercury",
          content: "Mercury is the closest planet to the Sun and the smallest of the eight major planets.\n\nMercury is a rocky world with a heavily cratered surface. Because it sits so close to the Sun and has almost no atmosphere to hold heat, temperatures change dramatically between its bright daytime side and its dark nighttime side.",
          notes: "Mercury completes an orbit around the Sun very quickly and has one of the most extreme environments in the solar system. Its landscape tells the story of constant exposure to space weather, impacts, and intense sunlight."
        },
        {
          chapter: "Planets",
          subtopic: "Venus",
          content: "Venus is a rocky planet wrapped in thick clouds and known for its intense heat.\n\nVenus is similar to Earth in size, but its atmosphere is much denser and made largely of carbon dioxide. Thick clouds trap heat so effectively that the planet's surface becomes hotter than Mercury's even though Venus is farther from the Sun.",
          notes: "Venus is often described as Earth's sister planet because of its size, but its actual conditions are far more hostile. It is a strong example of how atmospheric composition can completely shape a planet's climate."
        },
        {
          chapter: "Planets",
          subtopic: "Earth",
          content: "Earth is the only known planet with life and stable liquid water on its surface.\n\nEarth has oceans, a breathable atmosphere, and a climate system that supports a wide range of ecosystems. Its balance of water, land, air, and temperature makes it uniquely suitable for the life we know.",
          notes: "Earth is important not just because it is home, but because it offers a reference point for studying all other planets. Comparing Earth with nearby worlds helps explain how different planetary systems evolve over time."
        },
        {
          chapter: "Planets",
          subtopic: "Mars",
          content: "Mars is a cold desert planet with dusty red terrain and signs of an active past.\n\nMars has giant volcanoes, deep canyons, polar ice caps, and a thin atmosphere. Scientists have found strong evidence that liquid water once moved across its surface, making Mars a major target in the search for past habitability.",
          notes: "Mars feels familiar enough to imagine exploration, yet different enough to reveal how a planet can lose warmth and atmospheric density. Its surface preserves clues about ancient geology and climate change."
        },
        {
          chapter: "Planets",
          subtopic: "Jupiter",
          content: "Jupiter is the largest planet in the solar system and a classic gas giant.\n\nJupiter is made mostly of hydrogen and helium and does not have a solid surface like Earth or Mars. It is famous for its colorful cloud bands, powerful storms, and enormous scale, which dominates the outer solar system.",
          notes: "Jupiter helps shape the solar system through its strong gravity and large family of moons. It is a central world for understanding giant planets, atmospheric motion, and planetary formation."
        },
        {
          chapter: "Satellites",
          subtopic: "Moon",
          content: "The Moon is Earth's natural satellite and the brightest object in our night sky after the Sun.\n\nThe Moon orbits Earth and plays an important role in ocean tides and long-term stability. Its surface is covered with craters, plains, and highlands formed through billions of years of impacts and volcanic history.",
          notes: "The Moon is the most accessible natural satellite for human study and exploration. It also provides a direct record of early solar system history that has been preserved with little weathering or erosion."
        },
        {
          chapter: "Satellites",
          subtopic: "Europa",
          content: "Europa is one of Jupiter's major moons and is known for its icy shell.\n\nEuropa has a bright, fractured surface made of ice. Beneath that outer layer, scientists suspect a deep subsurface ocean may exist, which makes Europa one of the most compelling places to study possible habitable environments beyond Earth.",
          notes: "Europa is important because it combines a frozen exterior with the possibility of hidden liquid water. That mix makes it a major focus for planetary science and future space missions."
        }
      ];

      const state = {
        data: null,
        section: "",
        item: "",
        title: "Solar System"
      };

      const sectionNav = document.getElementById("sectionNav");
      const itemNav = document.getElementById("itemNav");
      const articleEyebrow = document.getElementById("articleEyebrow");
      const articleTitle = document.getElementById("articleTitle");
      const articleLede = document.getElementById("articleLede");
      const sectionDeck = document.getElementById("sectionDeck");
      const excelUpload = document.getElementById("excelUpload");
      const brandTitle = document.getElementById("brandTitle");
      const mobileContextTitle = document.getElementById("mobileContextTitle");
      const menuToggle = document.getElementById("menuToggle");
      const backdrop = document.getElementById("backdrop");

      function normalizeHeader(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "_")
          .replace(/^_+|_+$/g, "");
      }

      function slugify(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "") || "item";
      }

      function titleCaseWord(word) {
        return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
      }

      function formatWorkbookTitle(raw) {
        const cleaned = String(raw || "Solar System")
          .replace(/\.[^.]+$/, "")
          .replace(/[_-]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        const words = cleaned.split(" ").filter(Boolean).map(titleCaseWord);
        return words.length ? words : ["Solar", "System"];
      }

      function renderBrandTitle() {
        const words = formatWorkbookTitle(state.title);
        brandTitle.innerHTML = '<div class="brand-title">' + words.map((word, index) => {
          const accent = words.length > 1 && index === 1 ? ' accent' : '';
          return '<span class="brand-word' + accent + '">' + word + '</span>';
        }).join('') + '</div>';
        mobileContextTitle.textContent = words.join(' ');
      }

      function splitContent(text) {
        const value = String(text || "").trim();
        if (!value) {
          return { lead: "", body: "" };
        }

        const doubleBreak = value.split(/\n\s*\n/);
        if (doubleBreak.length > 1) {
          return {
            lead: doubleBreak[0].trim(),
            body: doubleBreak.slice(1).join("\n\n").trim()
          };
        }

        const sentenceMatch = value.match(/(.+?[.!?])\s+(.*)/);
        if (sentenceMatch) {
          return {
            lead: sentenceMatch[1].trim(),
            body: sentenceMatch[2].trim()
          };
        }

        return { lead: value, body: "" };
      }

      function summaryFromCards(cards, fallbackText) {
        const fallbackValue = String(fallbackText || "").trim();
        const fallbackChunks = fallbackValue
          .split(/\n\s*\n/)
          .map((part) => part.trim())
          .filter(Boolean);
        const preferredFallback = fallbackChunks.find((chunk) => !hasInlineHeading(chunk)) || "";
        const primary = preferredFallback || cards.find((card) => card.body)?.body || fallbackValue;
        const normalized = primary.replace(/\s+/g, " ").trim();
        if (!normalized) {
          return "";
        }
        const match = normalized.match(/(.+?[.!?])(\s|$)/);
        return match ? match[1].trim() : normalized;
      }

      function buildData(rows) {
        const sections = [];
        const sectionMap = new Map();

        rows.forEach((rawRow) => {
          const row = {};
          Object.entries(rawRow).forEach(([key, value]) => {
            row[normalizeHeader(key)] = value == null ? "" : String(value).trim();
          });

          const chapter = row.chapter || row.section || row.topic || row.group;
          const subtopic = row.subtopic || row.item || row.title || row.entry;
          const content = row.content || row.body || row.description || "";
          const notes = row.notes || row.detail || row.details || row.more || "";

          if (!chapter || !subtopic) {
            return;
          }

          const sectionKey = slugify(chapter);
          if (!sectionMap.has(sectionKey)) {
            const sectionObject = {
              key: sectionKey,
              number: String(sections.length + 1),
              label: chapter,
              items: []
            };
            sectionMap.set(sectionKey, sectionObject);
            sections.push(sectionObject);
          }

          const section = sectionMap.get(sectionKey);
          section.items.push({
            id: slugify(subtopic),
            number: section.number + "." + (section.items.length + 1),
            title: subtopic,
            content,
            notes
          });
        });

        if (!sections.length) {
          throw new Error("No usable rows found. Use at least chapter and subtopic columns.");
        }

        return { sections };
      }

      function setData(rows, titleLabel) {
        state.data = buildData(rows);
        state.title = titleLabel || "Solar System";
        state.section = state.data.sections[0].key;
        state.item = state.data.sections[0].items[0].id;
        renderBrandTitle();
        render();
      }

      function currentSection() {
        return state.data.sections.find((section) => section.key === state.section) || state.data.sections[0];
      }

      function currentItem() {
        return currentSection().items.find((item) => item.id === state.item) || currentSection().items[0];
      }

      function classifyTone(label) {
        const normalized = String(label || "").toLowerCase();
        if (normalized.includes("layman") && normalized.includes("example")) {
          return "example";
        }
        if (normalized.includes("technical")) {
          return "technical";
        }
        if (normalized.includes("layman")) {
          return "layman";
        }
        if (
          normalized.includes("overview") ||
          normalized.includes("summary") ||
          normalized.includes("key distinction") ||
          normalized.includes("context") ||
          normalized.includes("detail") ||
          normalized.includes("note")
        ) {
          return "overview";
        }
        return "default";
      }

      function hasInlineHeading(chunk) {
        const lines = String(chunk || "")
          .split(/\n+/)
          .map((line) => line.trim())
          .filter(Boolean);
        return lines.length > 1 && lines[0].length <= 34 && !/[.!?]$/.test(lines[0]);
      }

      function smartFallbackTitle(base, index) {
        const labels = {
          Overview: ["Overview", "Context", "Key Detail", "Further Context"],
          Notes: ["Notes", "Further Note", "Extra Detail", "Reference Note"]
        };
        const pool = labels[base] || [base];
        return pool[index] || pool[pool.length - 1];
      }

      function cardTitleFromChunk(chunk, fallbackTitle) {
        const lines = chunk.split(/\n+/).map((line) => line.trim()).filter(Boolean);
        if (!lines.length) {
          return null;
        }

        if (hasInlineHeading(chunk)) {
          return {
            title: lines[0],
            body: lines.slice(1).join("\n")
          };
        }

        return {
          title: fallbackTitle,
          body: lines.join("\n")
        };
      }

      function parseCards(item) {
        const cards = [];

        function pushFromText(text, fallbackTitle) {
          const chunks = String(text || "")
            .split(/\n\s*\n/)
            .map((part) => part.trim())
            .filter(Boolean);

          chunks.forEach((chunk, index) => {
              const explicitHeading = hasInlineHeading(chunk);
              const parsed = cardTitleFromChunk(
                chunk,
                smartFallbackTitle(fallbackTitle, index)
              );
              if (!parsed || !parsed.body) {
                return;
              }
              if (fallbackTitle === "Overview" && chunks.length > 1 && index === 0 && !explicitHeading) {
                return;
              }
              cards.push({
                title: parsed.title,
                body: parsed.body,
                tone: classifyTone(parsed.title)
              });
            });
        }

        pushFromText(item.content, "Overview");
        pushFromText(item.notes, "Notes");

        return cards;
      }

      function renderSectionNav() {
        sectionNav.innerHTML = state.data.sections
          .map((section) => {
            const active = section.key === state.section ? " active" : "";
            return '<a class="section-link' + active + '" href="#' + section.key + '" data-section="' + section.key + '"><span class="number">' + section.number + '</span>' + section.label + '</a>';
          })
          .join("");

        sectionNav.querySelectorAll("[data-section]").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            state.section = event.currentTarget.dataset.section;
            state.item = currentSection().items[0].id;
            render();
          });
        });
      }

      function renderItemNav() {
        const items = currentSection().items;
        itemNav.innerHTML = items
          .map((item) => {
            const active = item.id === state.item ? " active" : "";
            return '<li><a class="toc-link' + active + '" href="#' + currentSection().key + '/' + item.id + '" data-item="' + item.id + '"><span class="toc-number">' + item.number + '</span>' + item.title + '</a></li>';
          })
          .join("");

        itemNav.querySelectorAll("[data-item]").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            state.item = event.currentTarget.dataset.item;
            renderArticle();
            renderItemNav();
            syncHash();
            document.body.classList.remove("nav-open");
          });
        });
      }

      function renderArticle() {
        const item = currentItem();
        const parsed = splitContent(item.content);
        const cards = parseCards(item);

        articleEyebrow.textContent = item.number;
        articleTitle.textContent = item.title;
        articleLede.textContent = summaryFromCards(cards, parsed.lead || item.content) || "No content provided.";

        sectionDeck.innerHTML = cards
          .map((card) => {
            return '<section class="info-card tone-' + card.tone + '">' +
              '<div class="info-label">' + card.title + '</div>' +
              '<p>' + card.body.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</p>' +
            '</section>';
          })
          .join("");
      }

      function syncHash() {
        window.location.hash = currentSection().key + '/' + state.item;
      }

      function render() {
        renderSectionNav();
        renderItemNav();
        renderArticle();
        syncHash();
        document.body.classList.remove("nav-open");
      }

      function hydrateFromHash() {
        const raw = window.location.hash.replace(/^#/, "");
        if (!raw || !state.data) {
          return;
        }
        const [sectionKey, itemId] = raw.split('/');
        const section = state.data.sections.find((entry) => entry.key === sectionKey);
        if (!section) {
          return;
        }
        state.section = section.key;
        if (itemId && section.items.some((item) => item.id === itemId)) {
          state.item = itemId;
        } else {
          state.item = section.items[0].id;
        }
      }

      function preferredSheet(workbook) {
        return workbook.SheetNames.find((name) => normalizeHeader(name) === 'content') || workbook.SheetNames[0];
      }

      excelUpload.addEventListener('change', async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file || !window.XLSX) {
          return;
        }

        try {
          const buffer = await file.arrayBuffer();
          const workbook = XLSX.read(buffer, { type: 'array' });
          const sheetName = preferredSheet(workbook);
          const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });
          setData(rows, file.name);
        } catch (error) {
          console.error(error);
        }
      });

      if (menuToggle) {
        menuToggle.addEventListener('click', () => {
          document.body.classList.toggle('nav-open');
        });
      }

      backdrop.addEventListener('click', () => {
        document.body.classList.remove('nav-open');
      });

      setData(demoRows, 'Solar System');
      hydrateFromHash();
      render();

      window.addEventListener('hashchange', () => {
        hydrateFromHash();
        render();
      });
    </script>
  </body>
</html>
