<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excel Content Wireframe</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --line: #dfe4ec;
        --text: #1f2736;
        --muted: #667389;
        --faint: #8c97aa;
        --accent: #c43dff;
        --edit: #2563eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Lato", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      a { color: inherit; text-decoration: none; }
      button, input { font: inherit; }

      /* ── LAYOUT ── */
      .mobile-bar { display: none; }

      .shell {
        width: min(1420px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr) 280px;
        background: var(--surface);
      }

      .sidebar, .toc {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100vh;
        overflow-y: auto;
        background: var(--surface);
      }

      .sidebar {
        padding: 30px 22px 28px 28px;
        border-right: 1px solid var(--line);
      }

      .toc {
        padding: 18px 18px 28px;
        border-left: 1px solid var(--line);
      }

      /* ── BRAND ── */
      .brand { margin-bottom: 28px; }

      .brand-title {
        display: flex;
        flex-direction: column;
        gap: 1px;
        line-height: 0.92;
      }

      .brand-word {
        display: block;
        font-size: 1.58rem;
        font-weight: 700;
        letter-spacing: -0.05em;
        text-transform: capitalize;
      }

      .brand-word.accent {
        color: var(--accent);
        font-style: italic;
      }

      .sidebar h2, .toc h2 {
        margin: 0 0 10px;
        font-size: 1rem;
        font-weight: 400;
      }

      /* ── LEFT NAV ── */
      .section-nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .section-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 0;
        color: var(--muted);
        line-height: 1.2;
        cursor: pointer;
      }

      .section-link.active { color: var(--accent); }
      .section-link .number { display: inline-block; width: 18px; }

      .del-section {
        display: none;
        background: none;
        border: none;
        color: #ef4444;
        cursor: pointer;
        opacity: 0.4;
        font-size: 0.75rem;
        padding: 0 2px;
        line-height: 1;
        flex-shrink: 0;
      }
      .del-section:hover { opacity: 1; }

      /* ── MAIN CONTENT ── */
      .main {
        padding: 28px 68px 56px;
        min-width: 0;
      }

      .article { max-width: 760px; }

      .edit-indicator {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        margin-bottom: 20px;
        background: #eff6ff;
        border-radius: 8px;
        color: var(--edit);
        font-size: 0.82rem;
        border: 1px solid #bfdbfe;
      }

      body.edit-mode .edit-indicator { display: flex; }

      .edit-indicator .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--edit);
        flex-shrink: 0;
        animation: pulse 1.5s ease infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.25; }
      }

      .eyebrow {
        margin-bottom: 12px;
        color: var(--faint);
        font-size: 0.9rem;
      }

      .article h1 {
        margin: 0;
        font-size: clamp(2.5rem, 4vw, 3.5rem);
        line-height: 1;
        font-weight: 700;
      }

      /* ── ARTICLE BODY (rich text area) ── */
      .article-body {
        margin-top: 22px;
        font-size: 1rem;
        line-height: 1.76;
        color: var(--text);
        min-height: 60px;
      }

      .article-body p {
        margin: 0 0 14px;
      }

      .article-body p:first-child {
        color: var(--muted);
        font-size: 1.02rem;
        margin-bottom: 18px;
      }

      .article-body h2 {
        margin: 32px 0 10px;
        font-size: 1.5rem;
        font-weight: 600;
      }

      .article-body ul, .article-body ol {
        margin: 0 0 14px;
        padding-left: 24px;
      }

      .article-body li { margin-bottom: 4px; }

      .article-body img {
        max-width: 100%;
        border-radius: 8px;
        margin: 16px 0;
        display: block;
        border: 1px solid var(--line);
      }

      /* contenteditable styles */
      body.edit-mode [data-editable] {
        outline: none;
        border-radius: 6px;
        transition: box-shadow 0.15s;
        cursor: text;
      }

      body.edit-mode [data-editable]:hover {
        box-shadow: 0 0 0 2px #bfdbfe;
      }

      body.edit-mode [data-editable]:focus {
        box-shadow: 0 0 0 2px var(--edit);
      }

      body.edit-mode .article-body {
        padding: 8px;
        margin-left: -8px;
      }

      body.edit-mode .article h1[data-editable] {
        padding: 4px 8px;
        margin-left: -8px;
      }

      /* ── RIGHT SIDEBAR ── */
      .edit-panel {
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }

      .edit-toggle-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.88rem;
        transition: all 0.15s;
      }

      .edit-toggle-btn:hover {
        border-color: var(--edit);
        color: var(--edit);
      }

      body.edit-mode .edit-toggle-btn {
        background: var(--edit);
        border-color: var(--edit);
        color: #fff;
      }

      .edit-actions {
        display: none;
        flex-direction: column;
        gap: 6px;
        margin-top: 10px;
      }

      body.edit-mode .edit-actions { display: flex; }

      .action-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
        font-size: 0.84rem;
        transition: all 0.15s;
        text-align: left;
      }

      .action-btn:hover { background: #f5f7fa; }

      .action-btn.primary {
        background: #ecfdf5;
        border-color: #6ee7b7;
        color: #065f46;
        font-weight: 600;
      }

      .action-btn.primary:hover { background: #d1fae5; }

      .action-btn.danger {
        border-color: #fecaca;
        color: #b91c1c;
      }

      .action-btn.danger:hover { background: #fef2f2; }

      /* Upload label as button */
      label.action-btn {
        cursor: pointer;
      }

      label.action-btn input { display: none; }

      /* ── INLINE ADD PROMPT ── */
      .inline-add {
        display: none;
        gap: 5px;
        margin-top: 2px;
      }

      .inline-add.show { display: flex; }

      .inline-add input {
        flex: 1;
        padding: 5px 8px;
        border: 1px solid var(--edit);
        border-radius: 6px;
        font-size: 0.83rem;
        outline: none;
        min-width: 0;
      }

      .inline-add button {
        padding: 5px 9px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.83rem;
        line-height: 1;
      }

      .inline-add .ok-btn {
        background: var(--edit);
        color: #fff;
      }

      .inline-add .x-btn {
        background: #f1f5f9;
        color: var(--muted);
      }

      /* ── TOPICS LIST ── */
      .toc-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .toc-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 0 4px 10px;
        border-left: 2px solid transparent;
        color: var(--muted);
        line-height: 1.2;
        cursor: pointer;
      }

      .toc-link + .toc-link { margin-top: 4px; }

      .toc-link.active {
        border-left-color: var(--accent);
        color: var(--accent);
      }

      .toc-link .toc-number {
        display: inline-block;
        min-width: 34px;
      }

      .del-item {
        display: none;
        background: none;
        border: none;
        color: #ef4444;
        cursor: pointer;
        opacity: 0.4;
        font-size: 0.75rem;
        padding: 0 2px;
        line-height: 1;
        flex-shrink: 0;
      }

      .del-item:hover { opacity: 1; }

      body.edit-mode .del-section,
      body.edit-mode .del-item { display: inline-flex; }

      /* ── SAVE TOAST ── */
      .save-toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 10px 18px;
        background: #1a2332;
        color: #fff;
        border-radius: 10px;
        font-size: 0.88rem;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.22s, transform 0.22s;
        pointer-events: none;
        z-index: 999;
      }

      .save-toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      /* ── MOBILE ── */
      .backdrop { display: none; }

      @media (max-width: 1040px) {
        .mobile-bar {
          position: sticky;
          top: 0;
          z-index: 20;
          display: flex;
          align-items: center;
          gap: 12px;
          height: 52px;
          padding: 0 14px;
          border-bottom: 1px solid var(--line);
          background: rgba(255,255,255,0.94);
          backdrop-filter: blur(12px);
        }

        .mobile-toggle {
          width: 34px;
          height: 34px;
          border: 0;
          border-radius: 8px;
          background: transparent;
          color: var(--muted);
          cursor: pointer;
        }

        .mobile-toggle svg { width: 18px; height: 18px; }
        .mobile-title strong { display: block; font-size: 0.95rem; }
        .shell { grid-template-columns: 1fr; }

        .sidebar {
          position: fixed;
          top: 52px; left: 0; bottom: 0;
          width: min(84vw, 290px);
          z-index: 25;
          transform: translateX(-102%);
          transition: transform 0.22s ease;
        }

        body.nav-open .sidebar { transform: translateX(0); }

        .toc { display: none; }
        .main { padding: 24px 20px 40px; }
        .article { max-width: none; }

        .backdrop {
          position: fixed;
          inset: 52px 0 0;
          z-index: 15;
          display: block;
          opacity: 0;
          pointer-events: none;
          background: rgba(12,19,31,0.22);
          transition: opacity 0.22s ease;
        }

        body.nav-open .backdrop { opacity: 1; pointer-events: auto; }
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  </head>
  <body>

    <header class="mobile-bar">
      <button class="mobile-toggle" id="menuToggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"></path>
        </svg>
      </button>
      <div class="mobile-title">
        <strong id="mobileContextTitle">Solar System</strong>
      </div>
    </header>

    <div class="backdrop" id="backdrop"></div>

    <div class="shell">

      <!-- ── LEFT SIDEBAR ── -->
      <aside class="sidebar">
        <div class="brand" id="brandTitle"></div>
        <h2>Chapters</h2>
        <nav class="section-nav" id="sectionNav"></nav>
      </aside>

      <!-- ── MAIN CONTENT ── -->
      <main class="main">
        <article class="article">
          <div class="edit-indicator">
            <span class="pulse"></span>
            <span>Editing — click any text to change it · paste images anywhere</span>
          </div>
          <div class="eyebrow" id="articleEyebrow"></div>
          <h1 id="articleTitle" data-editable></h1>
          <div class="article-body" id="articleBody" data-editable></div>
        </article>
      </main>

      <!-- ── RIGHT SIDEBAR ── -->
      <aside class="toc">

        <!-- Edit Controls -->
        <div class="edit-panel">
          <button class="edit-toggle-btn" id="editToggleBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <span id="editBtnLabel">Edit Page</span>
          </button>

          <div class="edit-actions" id="editActions">
            <button class="action-btn primary" id="saveBtn">✓ Save Changes</button>

            <!-- Add item -->
            <button class="action-btn" id="addItemBtn">+ New Item</button>
            <div class="inline-add" id="addItemPrompt">
              <input type="text" id="newItemName" placeholder="Item name…" />
              <button class="ok-btn" id="confirmAddItem">Add</button>
              <button class="x-btn" id="cancelAddItem">✕</button>
            </div>

            <!-- Add chapter -->
            <button class="action-btn" id="addSectionBtn">+ New Chapter</button>
            <div class="inline-add" id="addSectionPrompt">
              <input type="text" id="newSectionName" placeholder="Chapter name…" />
              <button class="ok-btn" id="confirmAddSection">Add</button>
              <button class="x-btn" id="cancelAddSection">✕</button>
            </div>

            <!-- Import Excel -->
            <label class="action-btn" style="cursor:pointer">
              ↑ Import Excel
              <input id="excelUpload" type="file" accept=".xlsx,.xls" />
            </label>

            <!-- Reset -->
            <button class="action-btn danger" id="resetBtn">↩ Reset to Demo</button>
          </div>
        </div>

        <h2>Topics</h2>
        <ul class="toc-list" id="itemNav"></ul>
      </aside>
    </div>

    <!-- Toast notification -->
    <div class="save-toast" id="saveToast">✓ Saved</div>

    <script>
      // ═══════════════════════════════════════════════
      //  DEMO DATA
      // ═══════════════════════════════════════════════
      const demoRows = [
        {
          chapter: "Planets", subtopic: "Mercury",
          content: "Mercury is the closest planet to the Sun and the smallest of the eight major planets.\n\nMercury is a rocky world with a heavily cratered surface. Because it sits so close to the Sun and has almost no atmosphere to hold heat, temperatures change dramatically between its bright daytime side and its dark nighttime side.",
          notes: "Mercury completes an orbit around the Sun very quickly and has one of the most extreme environments in the solar system. Its landscape tells the story of constant exposure to space weather, impacts, and intense sunlight."
        },
        {
          chapter: "Planets", subtopic: "Venus",
          content: "Venus is a rocky planet wrapped in thick clouds and known for its intense heat.\n\nVenus is similar to Earth in size, but its atmosphere is much denser and made largely of carbon dioxide. Thick clouds trap heat so effectively that the planet's surface becomes hotter than Mercury's even though Venus is farther from the Sun.",
          notes: "Venus is often described as Earth's sister planet because of its size, but its actual conditions are far more hostile. It is a strong example of how atmospheric composition can completely shape a planet's climate."
        },
        {
          chapter: "Planets", subtopic: "Earth",
          content: "Earth is the only known planet with life and stable liquid water on its surface.\n\nEarth has oceans, a breathable atmosphere, and a climate system that supports a wide range of ecosystems. Its balance of water, land, air, and temperature makes it uniquely suitable for the life we know.",
          notes: "Earth is important not just because it is home, but because it offers a reference point for studying all other planets. Comparing Earth with nearby worlds helps explain how different planetary systems evolve over time."
        },
        {
          chapter: "Planets", subtopic: "Mars",
          content: "Mars is a cold desert planet with dusty red terrain and signs of an active past.\n\nMars has giant volcanoes, deep canyons, polar ice caps, and a thin atmosphere. Scientists have found strong evidence that liquid water once moved across its surface.",
          notes: "Mars feels familiar enough to imagine exploration, yet different enough to reveal how a planet can lose warmth and atmospheric density. Its surface preserves clues about ancient geology and climate change."
        },
        {
          chapter: "Planets", subtopic: "Jupiter",
          content: "Jupiter is the largest planet in the solar system and a classic gas giant.\n\nJupiter is made mostly of hydrogen and helium and does not have a solid surface like Earth or Mars. It is famous for its colorful cloud bands, powerful storms, and enormous scale.",
          notes: "Jupiter helps shape the solar system through its strong gravity and large family of moons. It is a central world for understanding giant planets, atmospheric motion, and planetary formation."
        },
        {
          chapter: "Satellites", subtopic: "Moon",
          content: "The Moon is Earth's natural satellite and the brightest object in our night sky after the Sun.\n\nThe Moon orbits Earth and plays an important role in ocean tides and long-term stability. Its surface is covered with craters, plains, and highlands formed through billions of years of impacts.",
          notes: "The Moon is the most accessible natural satellite for human study and exploration. It also provides a direct record of early solar system history that has been preserved with little weathering or erosion."
        },
        {
          chapter: "Satellites", subtopic: "Europa",
          content: "Europa is one of Jupiter's major moons and is known for its icy shell.\n\nEuropa has a bright, fractured surface made of ice. Beneath that outer layer, scientists suspect a deep subsurface ocean may exist, which makes Europa one of the most compelling places to study possible habitable environments beyond Earth.",
          notes: "Europa is important because it combines a frozen exterior with the possibility of hidden liquid water. That mix makes it a major focus for planetary science and future space missions."
        }
      ];

      // ═══════════════════════════════════════════════
      //  STATE
      // ═══════════════════════════════════════════════
      const state = {
        data: null,
        section: "",
        item: "",
        title: "Solar System",
        editMode: false
      };

      // ═══════════════════════════════════════════════
      //  STORAGE
      // ═══════════════════════════════════════════════
      const STORAGE_KEY = 'wireframe_v2';

      function loadFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch(e) {}
        return null;
      }

      function saveToStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            version: 2,
            title: state.title,
            sections: state.data.sections
          }));
        } catch(e) {
          alert('Save failed — storage may be full: ' + e.message);
        }
      }

      function clearStorage() {
        localStorage.removeItem(STORAGE_KEY);
      }

      // ═══════════════════════════════════════════════
      //  UTILITIES
      // ═══════════════════════════════════════════════
      function escHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function normalizeHeader(v) {
        return String(v || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      }

      function slugify(v) {
        return String(v || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'item';
      }

      function uid() { return Date.now().toString(36); }

      function titleCaseWord(w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }

      function formatWorkbookTitle(raw) {
        const cleaned = String(raw || 'Solar System')
          .replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
        const words = cleaned.split(' ').filter(Boolean).map(titleCaseWord);
        return words.length ? words : ['Solar', 'System'];
      }

      function splitContent(text) {
        const v = String(text || '').trim();
        if (!v) return { lead: '', body: '' };
        const dbl = v.split(/\n\s*\n/);
        if (dbl.length > 1) return { lead: dbl[0].trim(), body: dbl.slice(1).join('\n\n').trim() };
        const m = v.match(/(.+?[.!?])\s+(.*)/s);
        if (m) return { lead: m[1].trim(), body: m[2].trim() };
        return { lead: v, body: '' };
      }

      // Convert plain-text row to initial rich HTML
      function plainToHTML(item) {
        const parsed = splitContent(item.content);
        let html = '';
        if (parsed.lead) {
          html += '<p>' + escHtml(parsed.lead) + '</p>';
        }
        if (parsed.body) {
          parsed.body.split(/\n\s*\n/).forEach(p => {
            if (p.trim()) html += '<p>' + escHtml(p.trim()).replace(/\n/g, '<br>') + '</p>';
          });
        }
        if (item.notes) {
          html += '<h2>Notes</h2>';
          item.notes.split(/\n\s*\n/).forEach(p => {
            if (p.trim()) html += '<p>' + escHtml(p.trim()).replace(/\n/g, '<br>') + '</p>';
          });
        }
        if (!html) html = '<p>Click <strong>Edit Page</strong> to start adding content.</p>';
        return html;
      }

      // ═══════════════════════════════════════════════
      //  DOM REFS
      // ═══════════════════════════════════════════════
      const sectionNav       = document.getElementById('sectionNav');
      const itemNav          = document.getElementById('itemNav');
      const articleEyebrow   = document.getElementById('articleEyebrow');
      const articleTitle     = document.getElementById('articleTitle');
      const articleBody      = document.getElementById('articleBody');
      const excelUpload      = document.getElementById('excelUpload');
      const brandTitle       = document.getElementById('brandTitle');
      const mobileCtxTitle   = document.getElementById('mobileContextTitle');
      const menuToggle       = document.getElementById('menuToggle');
      const backdrop         = document.getElementById('backdrop');
      const editToggleBtn    = document.getElementById('editToggleBtn');
      const editBtnLabel     = document.getElementById('editBtnLabel');
      const saveBtn          = document.getElementById('saveBtn');
      const resetBtn         = document.getElementById('resetBtn');
      const addItemBtn       = document.getElementById('addItemBtn');
      const addSectionBtn    = document.getElementById('addSectionBtn');
      const addItemPrompt    = document.getElementById('addItemPrompt');
      const addSectionPrompt = document.getElementById('addSectionPrompt');
      const newItemName      = document.getElementById('newItemName');
      const newSectionName   = document.getElementById('newSectionName');
      const saveToast        = document.getElementById('saveToast');

      // ═══════════════════════════════════════════════
      //  BRAND TITLE
      // ═══════════════════════════════════════════════
      function renderBrandTitle() {
        const words = formatWorkbookTitle(state.title);
        brandTitle.innerHTML = '<div class="brand-title">' +
          words.map((w, i) => {
            const cls = (words.length > 1 && i === 1) ? ' accent' : '';
            return '<span class="brand-word' + cls + '">' + escHtml(w) + '</span>';
          }).join('') + '</div>';
        mobileCtxTitle.textContent = words.join(' ');
      }

      // ═══════════════════════════════════════════════
      //  DATA BUILDING
      // ═══════════════════════════════════════════════
      function buildData(rows) {
        const sections = [];
        const sectionMap = new Map();

        rows.forEach(rawRow => {
          const row = {};
          Object.entries(rawRow).forEach(([k, v]) => {
            row[normalizeHeader(k)] = v == null ? '' : String(v).trim();
          });

          const chapter  = row.chapter  || row.section || row.topic || row.group;
          const subtopic = row.subtopic || row.item    || row.title || row.entry;
          const content  = row.content  || row.body    || row.description || '';
          const notes    = row.notes    || row.detail  || row.details     || row.more || '';

          if (!chapter || !subtopic) return;

          const sectionKey = slugify(chapter);
          if (!sectionMap.has(sectionKey)) {
            const obj = {
              key: sectionKey,
              number: String(sections.length + 1),
              label: chapter,
              items: []
            };
            sectionMap.set(sectionKey, obj);
            sections.push(obj);
          }

          const section = sectionMap.get(sectionKey);
          section.items.push({
            id: slugify(subtopic) + '-' + uid(),
            number: section.number + '.' + (section.items.length + 1),
            title: subtopic,
            content,
            notes,
            bodyHTML: null    // null → use plainToHTML() on first render
          });
        });

        if (!sections.length) throw new Error('No usable rows found. Spreadsheet needs at least "chapter" and "subtopic" columns.');
        return { sections };
      }

      function setData(rows, titleLabel) {
        state.data    = buildData(rows);
        state.title   = titleLabel || 'Solar System';
        state.section = state.data.sections[0].key;
        state.item    = state.data.sections[0].items[0].id;
        renderBrandTitle();
        render();
      }

      function renumberAll() {
        state.data.sections.forEach((sec, si) => {
          sec.number = String(si + 1);
          sec.items.forEach((item, ii) => {
            item.number = sec.number + '.' + (ii + 1);
          });
        });
      }

      // ═══════════════════════════════════════════════
      //  NAVIGATION HELPERS
      // ═══════════════════════════════════════════════
      function currentSection() {
        return state.data.sections.find(s => s.key === state.section) || state.data.sections[0];
      }

      function currentItem() {
        const sec = currentSection();
        return sec.items.find(i => i.id === state.item) || sec.items[0];
      }

      // ═══════════════════════════════════════════════
      //  CAPTURE DOM → ITEM DATA (call before navigation)
      // ═══════════════════════════════════════════════
      function captureCurrentItem() {
        if (!state.data) return;
        const item = currentItem();
        if (!item) return;
        item.title   = articleTitle.textContent.trim() || item.title;
        item.bodyHTML = articleBody.innerHTML;
      }

      // ═══════════════════════════════════════════════
      //  RENDER FUNCTIONS
      // ═══════════════════════════════════════════════
      function renderSectionNav() {
        sectionNav.innerHTML = state.data.sections.map(sec => {
          const active = sec.key === state.section ? ' active' : '';
          return `<a class="section-link${active}" href="#${sec.key}" data-section="${sec.key}">
            <span><span class="number">${escHtml(sec.number)}</span>${escHtml(sec.label)}</span>
            <button class="del-section" data-delsec="${sec.key}" title="Delete chapter">✕</button>
          </a>`;
        }).join('');

        sectionNav.querySelectorAll('[data-section]').forEach(link => {
          link.addEventListener('click', e => {
            const delBtn = e.target.closest('[data-delsec]');
            if (delBtn) {
              e.preventDefault();
              e.stopPropagation();
              const key = delBtn.dataset.delsec;
              const sec = state.data.sections.find(s => s.key === key);
              if (!sec || !confirm(`Delete chapter "${sec.label}" and all its items?`)) return;
              state.data.sections = state.data.sections.filter(s => s.key !== key);
              renumberAll();
              if (!state.data.sections.length) {
                // Edge case: all deleted
                clearStorage();
                setData(demoRows, 'Solar System');
                return;
              }
              if (state.section === key) {
                state.section = state.data.sections[0].key;
                state.item    = state.data.sections[0].items[0]?.id || '';
              }
              render();
              return;
            }
            e.preventDefault();
            if (state.editMode) captureCurrentItem();
            state.section = e.currentTarget.dataset.section;
            state.item    = currentSection().items[0]?.id || '';
            render();
          });
        });
      }

      function renderItemNav() {
        const items = currentSection().items;
        itemNav.innerHTML = items.map(item => {
          const active = item.id === state.item ? ' active' : '';
          return `<li><a class="toc-link${active}" href="#${currentSection().key}/${item.id}" data-item="${item.id}">
            <span><span class="toc-number">${escHtml(item.number)}</span>${escHtml(item.title)}</span>
            <button class="del-item" data-delitem="${item.id}" title="Delete item">✕</button>
          </a></li>`;
        }).join('');

        itemNav.querySelectorAll('[data-item]').forEach(link => {
          link.addEventListener('click', e => {
            const delBtn = e.target.closest('[data-delitem]');
            if (delBtn) {
              e.preventDefault();
              e.stopPropagation();
              const id  = delBtn.dataset.delitem;
              const sec = currentSection();
              const itm = sec.items.find(i => i.id === id);
              if (!itm || !confirm(`Delete "${itm.title}"?`)) return;
              sec.items = sec.items.filter(i => i.id !== id);
              renumberAll();
              if (state.item === id) state.item = sec.items[0]?.id || '';
              render();
              return;
            }
            e.preventDefault();
            if (state.editMode) captureCurrentItem();
            state.item = e.currentTarget.dataset.item;
            renderArticle();
            renderItemNav();
            syncHash();
            document.body.classList.remove('nav-open');
          });
        });
      }

      function renderArticle() {
        const item = currentItem();
        if (!item) return;

        const html = (item.bodyHTML !== null && item.bodyHTML !== undefined)
          ? item.bodyHTML
          : plainToHTML(item);

        articleEyebrow.textContent   = item.number;
        articleTitle.textContent     = item.title;
        articleBody.innerHTML        = html;

        // Toggle contenteditable
        articleTitle.contentEditable = state.editMode ? 'true' : 'false';
        articleBody.contentEditable  = state.editMode ? 'true' : 'false';
      }

      function syncHash() {
        if (!state.section || !state.item) return;
        window.location.hash = state.section + '/' + state.item;
      }

      function render() {
        renderSectionNav();
        renderItemNav();
        renderArticle();
        syncHash();
        document.body.classList.remove('nav-open');
      }

      // ═══════════════════════════════════════════════
      //  EDIT MODE
      // ═══════════════════════════════════════════════
      function toggleEditMode() {
        if (state.editMode) {
          // Exiting → auto-save
          captureCurrentItem();
          saveToStorage();
          state.editMode = false;
          showToast('✓ Saved');
        } else {
          state.editMode = true;
        }

        document.body.classList.toggle('edit-mode', state.editMode);
        editBtnLabel.textContent = state.editMode ? 'Exit Edit' : 'Edit Page';

        // Flip contenteditable on the current article
        articleTitle.contentEditable = state.editMode ? 'true' : 'false';
        articleBody.contentEditable  = state.editMode ? 'true' : 'false';

        // Re-render nav (shows/hides delete buttons)
        renderSectionNav();
        renderItemNav();

        if (state.editMode) {
          articleBody.focus();
        }
      }

      // ═══════════════════════════════════════════════
      //  SAVE (explicit button)
      // ═══════════════════════════════════════════════
      function saveExplicit() {
        captureCurrentItem();
        saveToStorage();
        showToast('✓ Saved');
      }

      function showToast(msg) {
        saveToast.textContent = msg;
        saveToast.classList.add('show');
        setTimeout(() => saveToast.classList.remove('show'), 2400);
      }

      // ═══════════════════════════════════════════════
      //  IMAGE PASTE
      // ═══════════════════════════════════════════════
      document.addEventListener('paste', e => {
        if (!state.editMode) return;
        const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
        if (!items) return;

        for (const item of items) {
          if (item.type.startsWith('image/')) {
            e.preventDefault();
            const blob   = item.getAsFile();
            const reader = new FileReader();
            reader.onload = ev => {
              const img = document.createElement('img');
              img.src = ev.target.result;
              img.alt = 'pasted image';
              insertNodeAtCursor(img);
            };
            reader.readAsDataURL(blob);
            break;
          }
        }
      });

      function insertNodeAtCursor(node) {
        const sel = window.getSelection();
        if (sel && sel.rangeCount) {
          const range = sel.getRangeAt(0);
          // Only insert inside articleBody
          if (articleBody.contains(range.commonAncestorContainer)) {
            range.deleteContents();
            range.insertNode(node);
            // Move cursor after the inserted node
            const after = document.createRange();
            after.setStartAfter(node);
            after.collapse(true);
            sel.removeAllRanges();
            sel.addRange(after);
            return;
          }
        }
        // Fallback: append to article body
        articleBody.appendChild(node);
      }

      // ═══════════════════════════════════════════════
      //  ADD ITEM / CHAPTER
      // ═══════════════════════════════════════════════
      function showPrompt(promptEl, inputEl) {
        // Close the other prompt
        [addItemPrompt, addSectionPrompt].forEach(p => {
          if (p !== promptEl) p.classList.remove('show');
        });
        promptEl.classList.toggle('show');
        if (promptEl.classList.contains('show')) {
          inputEl.value = '';
          setTimeout(() => inputEl.focus(), 50);
        }
      }

      addItemBtn.addEventListener('click', () => showPrompt(addItemPrompt, newItemName));
      addSectionBtn.addEventListener('click', () => showPrompt(addSectionPrompt, newSectionName));

      document.getElementById('cancelAddItem').addEventListener('click', () => addItemPrompt.classList.remove('show'));
      document.getElementById('cancelAddSection').addEventListener('click', () => addSectionPrompt.classList.remove('show'));

      function doAddItem() {
        const name = newItemName.value.trim();
        if (!name) { newItemName.focus(); return; }
        captureCurrentItem();
        const sec = currentSection();
        const id  = slugify(name) + '-' + uid();
        sec.items.push({
          id,
          number: sec.number + '.' + (sec.items.length + 1),
          title: name,
          content: '',
          notes: '',
          bodyHTML: '<p>Start writing here. You can paste images too.</p>'
        });
        addItemPrompt.classList.remove('show');
        state.item = id;
        render();
        if (!state.editMode) toggleEditMode();
        else renderArticle();
        articleBody.focus();
      }

      function doAddSection() {
        const name = newSectionName.value.trim();
        if (!name) { newSectionName.focus(); return; }
        captureCurrentItem();
        const key    = slugify(name) + '-' + uid();
        const number = String(state.data.sections.length + 1);
        const firstId = 'new-' + uid();
        state.data.sections.push({
          key,
          number,
          label: name,
          items: [{
            id: firstId,
            number: number + '.1',
            title: 'New Item',
            content: '',
            notes: '',
            bodyHTML: '<p>Start writing here. You can paste images too.</p>'
          }]
        });
        addSectionPrompt.classList.remove('show');
        state.section = key;
        state.item    = firstId;
        render();
        if (!state.editMode) toggleEditMode();
        else renderArticle();
      }

      document.getElementById('confirmAddItem').addEventListener('click', doAddItem);
      newItemName.addEventListener('keydown', e => { if (e.key === 'Enter') doAddItem(); });

      document.getElementById('confirmAddSection').addEventListener('click', doAddSection);
      newSectionName.addEventListener('keydown', e => { if (e.key === 'Enter') doAddSection(); });

      // ═══════════════════════════════════════════════
      //  RESET
      // ═══════════════════════════════════════════════
      resetBtn.addEventListener('click', () => {
        if (!confirm('Reset to demo data? All edits will be lost.')) return;
        clearStorage();
        if (state.editMode) {
          state.editMode = false;
          document.body.classList.remove('edit-mode');
          editBtnLabel.textContent = 'Edit Page';
        }
        setData(demoRows, 'Solar System');
      });

      // ═══════════════════════════════════════════════
      //  EXCEL IMPORT
      // ═══════════════════════════════════════════════
      function preferredSheet(wb) {
        return wb.SheetNames.find(n => normalizeHeader(n) === 'content') || wb.SheetNames[0];
      }

      excelUpload.addEventListener('change', async e => {
        const file = e.target.files && e.target.files[0];
        if (!file || !window.XLSX) return;
        try {
          const buffer = await file.arrayBuffer();
          const wb     = XLSX.read(buffer, { type: 'array' });
          const sheet  = preferredSheet(wb);
          const rows   = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { defval: '' });
          clearStorage();
          setData(rows, file.name);
          showToast('✓ Excel imported');
        } catch(err) {
          alert('Could not read file: ' + err.message);
        }
        e.target.value = '';
      });

      // ═══════════════════════════════════════════════
      //  EDIT BUTTON
      // ═══════════════════════════════════════════════
      editToggleBtn.addEventListener('click', toggleEditMode);
      saveBtn.addEventListener('click', saveExplicit);

      // ═══════════════════════════════════════════════
      //  MOBILE NAV
      // ═══════════════════════════════════════════════
      menuToggle.addEventListener('click', () => document.body.classList.toggle('nav-open'));
      backdrop.addEventListener('click',   () => document.body.classList.remove('nav-open'));

      // ═══════════════════════════════════════════════
      //  HASH HYDRATION
      // ═══════════════════════════════════════════════
      function hydrateFromHash() {
        const raw = window.location.hash.replace(/^#/, '');
        if (!raw || !state.data) return;
        const [sectionKey, itemId] = raw.split('/');
        const sec = state.data.sections.find(s => s.key === sectionKey);
        if (!sec) return;
        state.section = sec.key;
        state.item    = sec.items.some(i => i.id === itemId) ? itemId : sec.items[0].id;
      }

      // ═══════════════════════════════════════════════
      //  INIT
      // ═══════════════════════════════════════════════
      (function init() {
        const saved = loadFromStorage();
        if (saved && saved.sections && saved.sections.length) {
          state.data    = { sections: saved.sections };
          state.title   = saved.title || 'My Docs';
          state.section = saved.sections[0].key;
          state.item    = saved.sections[0].items[0]?.id || '';
          renderBrandTitle();
          hydrateFromHash();
          render();
          showToast('↺ Loaded saved content');
        } else {
          setData(demoRows, 'Solar System');
          hydrateFromHash();
          render();
        }
      })();

      window.addEventListener('hashchange', () => {
        hydrateFromHash();
        if (!state.editMode) render();
      });
    </script>
  </body>
</html>
