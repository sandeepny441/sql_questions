uards the mortgages or securities in a pool</td></tr><tr><td><strong>Default</strong></td><td>Failure to make required loan or bond payments on time</td></tr><tr><td><strong>Delinquency</strong></td><td>A situation where a borrower is late on payments but has not yet defaulted</td></tr><tr><td><strong>Discount</strong></td><td>When a bond's market price is below its face value (occurs when rates have risen since issuance)</td></tr><tr><td><strong>Discount Bond</strong></td><td>A bond trading below par value; typically occurs when its coupon is lower than current market rates</td></tr><tr><td><strong>Discount Rate</strong></td><td>The interest rate used to calculate the present value of future cash flows</td></tr><tr><td><strong>Dollar Roll</strong></td><td>A short-term trading transaction where an investor sells an MBS and simultaneously agrees to repurchase a similar one at a later date</td></tr><tr><td><strong>Duration</strong></td><td>A measure of how sensitive a bond's price is to changes in interest rates; expressed in years</td></tr><tr><td><strong>Effective Duration</strong></td><td>A measure of duration that accounts for the impact of prepayments and callable features</td></tr><tr><td><strong>Extension Risk</strong></td><td>The risk that falling interest rates will cause prepayments to slow, extending the bond's life longer than expected</td></tr><tr><td><strong>Face Value</strong></td><td>The principal amount of a bond that will be repaid at maturity (also called par value or par)</td></tr><tr><td><strong>Fannie Mae</strong></td><td>Federal National Mortgage Association; a government-sponsored enterprise that buys, guarantees, and securitizes mortgages</td></tr><tr><td><strong>Fixed-Rate Mortgage</strong></td><td>A mortgage where the interest rate stays the same throughout the loan term</td></tr><tr><td><strong>Floater</strong></td><td>A bond with a variable coupon rate that adjusts periodically based on a reference rate</td></tr><tr><td><strong>Floater Cap</strong></td><td>The maximum interest rate a floating-rate bond can pay</td></tr><tr><td><strong>Floater Floor</strong></td><td>The minimum interest rate a floating-rate bond can pay</td></tr><tr><td><strong>Forward MBS</strong></td><td>An MBS that will be delivered in the future, not immediately</td></tr><tr><td><strong>Freddie Mac</strong></td><td>Federal Home Loan Mortgage Corporation; a government-sponsored enterprise that buys and securitizes mortgages</td></tr><tr><td><strong>Freddie Mac PC</strong></td><td>Participation Certificate issued by Freddie Mac; an agency MBS product</td></tr><tr><td><strong>Ginnie Mae</strong></td><td>Government National Mortgage Association; issues MBS backed by government-insured loans (FHA, VA, USDA)</td></tr><tr><td><strong>Gross Coupon</strong></td><td>The total interest rate on mortgages in a pool before the servicer takes their cut</td></tr><tr><td><strong>GSE</strong></td><td>Government-Sponsored Enterprise; includes Fannie Mae, Freddie Mac, and Ginnie Mae</td></tr><tr><td><strong>Hedge</strong></td><td>A transaction designed to reduce or offset the risk of another investment</td></tr><tr><td><strong>Index</strong></td><td>A benchmark rate (like SOFR or the 10-year Treasury yield) used to determine interest rates on adjustable products</td></tr><tr><td><strong>Interest Rate Risk</strong></td><td>The risk that bond prices will fall if interest rates rise</td></tr><tr><td><strong>Interest-Only Strip (IO)</strong></td><td>A security that receives only the interest payments from a mortgage pool, not the principal</td></tr><tr><td><strong>Inverse Floater</strong></td><td>A floating-rate bond where the coupon moves in the opposite direction of market rates</td></tr><tr><td><strong>Liquidity</strong></td><td>The ease with which a security can be bought or sold quickly without significantly affecting its price</td></tr><tr><td><strong>Liquidity Risk</strong></td><td>The risk that a security cannot be sold quickly without taking a significant loss</td></tr><tr><td><strong>LTV</strong></td><td>Loan-to-Value; the loan amount divided by the property's value, expressed as a percentage</td></tr><tr><td><strong>FICO Score</strong></td><td>A credit score ranging from 300 to 850 that measures an individual's creditworthiness</td></tr><tr><td><strong>Make-Whole Provision</strong></td><td>A clause allowing a borrower to pay off a loan early without penalty, usually by compensating the lender for lost interest</td></tr><tr><td><strong>Maturity Date</strong></td><td>The date on which the principal of a bond must be repaid</td></tr><tr><td><strong>Moral Hazard</strong></td><td>The risk that one party will take excessive risks knowing another party bears the cost of failure</td></tr><tr><td><strong>Mortgage Pool</strong></td><td>A collection of mortgages bundled together to create mortgage-backed securities</td></tr><tr><td><strong>Mortgage Pass-Through</strong></td><td>An MBS where investors receive a proportional share of all principal and interest payments (minus servicing fees)</td></tr><tr><td><strong>Negative Convexity</strong></td><td>A characteristic of callable bonds where price appreciation is limited when rates fall due to call option</td></tr><tr><td><strong>Non-Agency MBS</strong></td><td>Mortgage-backed securities not issued or guaranteed by government-sponsored enterprises; subject to credit risk</td></tr><tr><td><strong>OAS</strong></td><td>Option-Adjusted Spread; a measure of yield spread that accounts for embedded options like prepayment</td></tr><tr><td><strong>Overcollateralization</strong></td><td>When the value of collateral exceeds the amount of debt issued against it; provides a cushion for bondholders</td></tr><tr><td><strong>Par Value</strong></td><td>The face value of a bond; the amount that will be repaid at maturity</td></tr><tr><td><strong>Pass-Through Rate</strong></td><td>The interest rate paid to MBS investors; typically less than the gross coupon due to servicing fees</td></tr><tr><td><strong>Payment Delay</strong></td><td>The number of days between when a mortgage payment is collected and when it's passed through to MBS investors</td></tr><tr><td><strong>Pool Factor</strong></td><td>A number showing what percentage of the original principal remains outstanding (ranges from 1.0 to 0.0)</td></tr><tr><td><strong>Prepayment</strong></td><td>Early repayment of a loan before the scheduled maturity date</td></tr><tr><td><strong>Prepayment Penalty</strong></td><td>A fee charged to a borrower for paying off a loan early</td></tr><tr><td><strong>Prepayment Risk</strong></td><td>The risk that rising interest rates will slow prepayments, extending the bond's duration</td></tr><tr><td><strong>Premium Bond</strong></td><td>A bond trading above par value; typically occurs when its coupon is higher than current market rates</td></tr><tr><td><strong>Principal</strong></td><td>The original amount borrowed or the face value of a bond</td></tr><tr><td><strong>Principal-Only Strip (PO)</strong></td><td>A security that receives only the principal payments from a mortgage pool, not the interest</td></tr><tr><td><strong>Prospectus</strong></td><td>A detailed document describing a security's terms, risks, and the issuer</td></tr><tr><td><strong>PSA Model</strong></td><td>A standard model that predicts mortgage prepayment speeds; 100% PSA is the baseline assumption</td></tr><tr><td><strong>Purchase Agreement</strong></td><td>A contract between the mortgage originator and the entity buying the mortgages for securitization</td></tr><tr><td><strong>Qualified Mortgage (QM)</strong></td><td>A mortgage meeting specific criteria established by regulations; offers certain legal protections</td></tr><tr><td><strong>Ramp-Up</strong></td><td>The initial period of a CMO tranche where it doesn't receive principal payments yet</td></tr><tr><td><strong>Real Estate Mortgage Investment Conduit (REMIC)</strong></td><td>A special legal structure used for securitizing mortgages with tax benefits</td></tr><tr><td><strong>Refinancing</strong></td><td>The process of replacing an existing loan with a new loan, typically to get better terms</td></tr><tr><td><strong>Reinvestment Risk</strong></td><td>The risk that interest and principal payments will have to be reinvested at lower rates</td></tr><tr><td><strong>Remainder Tranche</strong></td><td>The lowest priority tranche in a CMO that absorbs losses first</td></tr><tr><td><strong>Repurchase Agreement (Repo)</strong></td><td>A short-term transaction where securities are sold with an agreement to repurchase them at a set price</td></tr><tr><td><strong>Residual Tranche</strong></td><td>The final CMO tranche that receives whatever cash remains after other tranches are paid</td></tr><tr><td><strong>Reverse Floater</strong></td><td>Same as inverse floater; a bond with a coupon that moves opposite to interest rate changes</td></tr><tr><td><strong>Reverse Mortgage</strong></td><td>A mortgage allowing homeowners to borrow against their home equity, with repayment typically due upon death or sale</td></tr><tr><td><strong>S&P 500</strong></td><td>The Standard & Poor's 500 Index; a benchmark index of large-cap U.S. stocks</td></tr><tr><td><strong>Secondary Market</strong></td><td>The market where existing securities are bought and sold between investors</td></tr><tr><td><strong>Securitization</strong></td><td>The process of pooling loans and creating tradable securities backed by those loans</td></tr><tr><td><strong>Servicer</strong></td><td>The company responsible for collecting mortgage payments, maintaining escrow accounts, and managing delinquencies</td></tr><tr><td><strong>Servicing Fee</strong></td><td>The fee charged by a servicer, typically 0.25% to 0.50% of the outstanding balance annually</td></tr><tr><td><strong>Settlement Date</strong></td><td>The date when payment is delivered and ownership of a security transfers from seller to buyer</td></tr><tr><td><strong>Shelf Registration</strong></td><td>A process allowing an issuer to register securities that can be sold over time without additional registration</td></tr><tr><td><strong>SOFR</strong></td><td>Secured Overnight Financing Rate; a benchmark interest rate replacing LIBOR</td></tr><tr><td><strong>Spread</strong></td><td>The difference in yield between two securities; indicates relative value and risk</td></tr><tr><td><strong>Stated Maturity</strong></td><td>The date the final payment on a bond is due</td></tr><tr><td><strong>Step-Up Bond</strong></td><td>A bond where the coupon rate increases at predetermined intervals</td></tr><tr><td><strong>Stripped MBS</strong></td><td>An MBS that has been divided into separate principal-only (PO) and interest-only (IO) securities</td></tr><tr><td><strong>Subordination</strong></td><td>A structure where some securities have lower priority claims than others in receiving cash flows</td></tr><tr><td><strong>Support Tranche</strong></td><td>In a CMO, a tranche that provides support to other tranches by absorbing prepayment risk</td></tr><tr><td><strong>Swap</strong></td><td>A transaction where two parties exchange cash flows, often used to hedge interest rate risk</td></tr><tr><td><strong>TAC Bond</strong></td><td>Targeted Amortization Class; a CMO tranche designed to have more stable prepayment characteristics</td></tr><tr><td><strong>Tail Risk</strong></td><td>The risk of rare, extreme events that have a small probability but large impact</td></tr><tr><td><strong>Tenor</strong></td><td>The time remaining until a bond's maturity</td></tr><tr><td><strong>Term Structure</strong></td><td>The relationship between bond yields and their time to maturity; often shown as a yield curve</td></tr><tr><td><strong>Trade Date</strong></td><td>The date when a securities transaction is agreed upon</td></tr><tr><td><strong>Tranche</strong></td><td>A portion or layer of a CMO or other structured security with its own priority, coupon, and maturity</td></tr><tr><td><strong>Treasury Bond</strong></td><td>A long-term debt security issued by the U.S. government; considered risk-free</td></tr><tr><td><strong>Underwriter</strong></td><td>A firm that buys securities from an issuer and sells them to investors</td></tr><tr><td><strong>Underwriting Standards</strong></td><td>The criteria used to determine whether a borrower qualifies for a mortgage</td></tr><tr><td><strong>WAC</strong></td><td>Weighted Average Coupon; the average interest rate on mortgages in a pool, weighted by balance</td></tr><tr><td><strong>WAM</strong></td><td>Weighted Average Maturity; the average remaining time to maturity of mortgages in a pool, weighted by balance</td></tr><tr><td><strong>Yield</strong></td><td>The annual return on a bond investment, expressed as a percentage</td></tr><tr><td><strong>Yield Curve</strong></td><td>A graph showing bond yields at different maturities; shape indicates economic expectations</td></tr><tr><td><strong>Yield Spread</strong></td><td>The difference in yield between two bonds, often indicating relative risk</td></tr><tr><td><strong>Z-Tranche</strong></td><td>An accrual bond in a CMO that receives no cash payments until earlier tranches are retired; interest accrues</td></tr></tbody></table><p class=\"source\">Source: mbs_jargon_guide.md — Full A-Z glossary from the Obsidian vault</p>"
            }
          ]
        }
      };

      const state = {
        section: "planets",
        item: "mercury",
        query: ""
      };

      const sectionNav = document.getElementById("sectionNav");
      const itemNav = document.getElementById("itemNav");
      const tocSearch = document.getElementById("tocSearch");
      const articleEyebrow = document.getElementById("articleEyebrow");
      const articleTitle = document.getElementById("articleTitle");
      const articleLede = document.getElementById("articleLede");
      const sectionOneTitle = document.getElementById("sectionOneTitle");
      const sectionOneBody = document.getElementById("sectionOneBody");
      const sectionTwoTitle = document.getElementById("sectionTwoTitle");
      const sectionTwoBody = document.getElementById("sectionTwoBody");
      const markdownSection = document.getElementById("markdownSection");
      const markdownContent = document.getElementById("markdownContent");
      const menuToggle = document.getElementById("menuToggle");
      const backdrop = document.getElementById("backdrop");

      function currentSection() {
        return content[state.section];
      }

      function filteredItems() {
        const query = state.query.trim().toLowerCase();
        const items = currentSection().items;
        if (!query) {
          return items;
        }
        return items.filter((item) => item.title.toLowerCase().includes(query));
      }

      function currentItem() {
        const visibleItems = filteredItems();
        const match = visibleItems.find((item) => item.id === state.item);
        return match || visibleItems[0] || currentSection().items[0];
      }

      function syncHash() {
        window.location.hash = state.section + "/" + state.item;
      }

      function renderSectionNav() {
        sectionNav.innerHTML = Object.entries(content)
          .map(([key, section]) => {
            const active = key === state.section ? " active" : "";
            return '<a class="section-link' + active + '" href="#' + key + '" data-section="' + key + '"><span class="number">' + section.number + '</span>' + section.label + '</a>';
          })
          .join("");

        sectionNav.querySelectorAll("[data-section]").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            const nextSection = event.currentTarget.dataset.section;
            state.section = nextSection;
            state.query = "";
            tocSearch.value = "";
            state.item = content[nextSection].items[0].id;
            render();
          });
        });
      }

      function renderItemNav() {
        const items = filteredItems();

        if (!items.length) {
          itemNav.innerHTML = '<li class="empty-note">No matches in this section.</li>';
          return;
        }

        itemNav.innerHTML = items
          .map((item) => {
            const active = item.id === state.item ? " active" : "";
            return '<li><a class="toc-link' + active + '" href="#' + state.section + '/' + item.id + '" data-item="' + item.id + '"><span class="toc-number">' + item.number + '</span>' + item.title + '</a></li>';
          })
          .join("");

        itemNav.querySelectorAll("[data-item]").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            state.item = event.currentTarget.dataset.item;
            render();
          });
        });
      }

      function renderArticle() {
        const section = currentSection();
        const item = currentItem();
        state.item = item.id;

        articleEyebrow.textContent = section.number + '. ' + section.label;
        articleTitle.textContent = item.title;
        articleLede.textContent = item.lede;

        const isMd = !!item.isMarkdown;

        if (isMd) {
          // Markdown file view
          sectionOneTitle.textContent = "";
          sectionOneBody.textContent = "";
          sectionTwoTitle.textContent = "";
          sectionTwoBody.textContent = "";
          markdownSection.style.display = "block";
          markdownContent.innerHTML = item.mdHtml || "<p>No content.</p>";

          // Hide the regular two sections
          document.querySelectorAll(".content-section:not(#markdownSection)").forEach(el => {
            el.style.display = "none";
          });
        } else {
          // Regular article view
          markdownSection.style.display = "none";
          document.querySelectorAll(".content-section:not(#markdownSection)").forEach(el => {
            el.style.display = "block";
          });

          sectionOneTitle.textContent = item.sectionOneTitle;
          sectionOneBody.textContent = item.sectionOneBody;
          sectionTwoTitle.textContent = item.sectionTwoTitle;
          sectionTwoBody.textContent = item.sectionTwoBody;
        }
      }

      function render() {
        renderSectionNav();
        renderItemNav();
        renderArticle();
        syncHash();
        document.body.classList.remove("nav-open");
      }

      function hydrateFromHash() {
        const raw = window.location.hash.replace(/^#/, "");
        if (!raw) {
          return;
        }

        const [section, item] = raw.split("/");
        if (content[section]) {
          state.section = section;
          if (item && content[section].items.some((entry) => entry.id === item)) {
            state.item = item;
          } else {
            state.item = content[section].items[0].id;
          }
        }
      }

      tocSearch.addEventListener("input", (event) => {
        state.query = event.target.value;
        const visible = filteredItems();
        if (visible.length && !visible.some((item) => item.id === state.item)) {
          state.item = visible[0].id;
        }
        renderItemNav();
        renderArticle();
      });

      if (menuToggle) {
        menuToggle.addEventListener("click", () => {
          document.body.classList.toggle("nav-open");
        });
      }

      backdrop.addEventListener("click", () => {
        document.body.classList.remove("nav-open");
      });

      hydrateFromHash();
      render();

      window.addEventListener("hashchange", () => {
        hydrateFromHash();
        render();
      });
    </script>
  </body>
</html>
