cepts here]", "images": [], "md_file": "statistics/10-outlier-detection/09-mahalanobis-distance-multiple-numeric-columns.md"}]}};
    let state = { ch: "chapter_1", topic: null };

    // Get elements
    const search = document.getElementById("search");
    const chapters = document.getElementById("chapters");
    const topics = document.getElementById("topics");
    const eyebrow = document.getElementById("eyebrow");
    const title = document.getElementById("title");
    const lede = document.getElementById("lede");
    const sec1title = document.getElementById("sec1title");
    const sec1body = document.getElementById("sec1body");
    const sec2title = document.getElementById("sec2title");
    const sec2body = document.getElementById("sec2body");

    // Render chapters
    function renderChapters() {
      const keys = Object.keys(data).sort((a,b) => data[a].number - data[b].number);
      chapters.innerHTML = keys.map(key => {
        const ch = data[key];
        const active = key === state.ch ? " active" : "";
        return `<a class="section-link${active}" data-ch="${key}">${ch.number}. ${ch.label}</a>`;
      }).join("");

      chapters.querySelectorAll(".section-link").forEach(el => {
        el.onclick = (e) => {
          e.preventDefault();
          state.ch = el.dataset.ch;
          state.topic = data[state.ch].items[0].id;
          render();
        };
      });
    }

    // Render topics
    function renderTopics() {
      const ch = data[state.ch];
      const query = search.value.toLowerCase();
      const filtered = query ? ch.items.filter(t => t.title.toLowerCase().includes(query)) : ch.items;

      topics.innerHTML = filtered.map(t => {
        const active = t.id === state.topic ? " active" : "";
        return `<li><a class="toc-link${active}" data-topic="${t.id}">${t.number}. ${t.title}</a></li>`;
      }).join("");

      topics.querySelectorAll(".toc-link").forEach(el => {
        el.onclick = (e) => {
          e.preventDefault();
          state.topic = el.dataset.topic;
          render();
        };
      });
    }

    // Render article
    function renderArticle() {
      const ch = data[state.ch];
      const t = ch.items.find(x => x.id === state.topic) || ch.items[0];
      state.topic = t.id;

      eyebrow.textContent = ch.number + ". " + ch.label;
      title.textContent = t.title;
      lede.textContent = t.lede;
      sec1title.textContent = t.sectionOneTitle;
      sec1body.textContent = t.sectionOneBody;
      sec2title.textContent = t.sectionTwoTitle;
      sec2body.textContent = t.sectionTwoBody;
    }

    function render() {
      renderChapters();
      renderTopics();
      renderArticle();
    }

    search.addEventListener("input", () => {
      const filtered = data[state.ch].items.filter(t => t.title.toLowerCase().includes(search.value.toLowerCase()));
      if (filtered.length && !filtered.find(t => t.id === state.topic)) {
        state.topic = filtered[0].id;
      }
      renderTopics();
      renderArticle();
    });

    // Initial render
    if (!state.topic && data[state.ch].items.length) {
      state.topic = data[state.ch].items[0].id;
    }
    render();
    </script>
