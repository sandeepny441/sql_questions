<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statistics Reference</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --border: #dfe4ee;
        --text: #202735;
        --muted: #5f6b80;
        --faint: #8a95a8;
        --accent: #00b7ff;
        --accent-strong: #009fdb;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Lato", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button, input {
        font: inherit;
      }

      .shell {
        width: min(1420px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr) 250px;
        background: var(--surface);
      }

      .sidebar, .toc {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100vh;
        overflow: auto;
        background: var(--surface);
      }

      .sidebar {
        padding: 34px 22px 28px 28px;
        border-right: 1px solid var(--border);
      }

      .toc {
        padding: 22px 24px 28px;
      }

      .brand {
        margin-bottom: 22px;
        line-height: 1.08;
      }

      .brand strong {
        display: block;
        font-size: 1.02rem;
        font-weight: 700;
      }

      .brand span {
        display: block;
        margin-top: 4px;
        color: var(--accent-strong);
        font-size: 0.98rem;
        font-style: italic;
      }

      .search-wrap {
        margin-bottom: 22px;
      }

      .search-wrap input {
        width: 100%;
        height: 30px;
        padding: 0 12px;
        border: 1px solid #d7dde8;
        border-radius: 4px;
        color: var(--text);
        background: #ffffff;
        outline: none;
      }

      .search-wrap input:focus {
        border-color: rgba(0, 183, 255, 0.75);
        box-shadow: 0 0 0 3px rgba(0, 183, 255, 0.12);
      }

      .section-nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .section-link {
        display: block;
        padding: 4px 0;
        color: var(--muted);
        line-height: 1.2;
        cursor: pointer;
      }

      .section-link:hover {
        color: var(--accent);
      }

      .section-link.active {
        color: var(--accent-strong);
        font-weight: 600;
      }

      .section-link .number {
        display: inline-block;
        width: 18px;
      }

      .main {
        padding: 28px 68px 56px;
        min-width: 0;
      }

      .article {
        max-width: 760px;
      }

      .eyebrow {
        margin-bottom: 10px;
        color: var(--faint);
        font-size: 0.82rem;
      }

      .article h1 {
        margin: 0;
        font-size: clamp(2.5rem, 4vw, 3.5rem);
        line-height: 1;
        font-weight: 700;
      }

      .lede {
        margin: 18px 0 26px;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.7;
      }

      .content-section + .content-section {
        margin-top: 34px;
      }

      .content-section h2 {
        margin: 0 0 12px;
        font-size: 1.7rem;
        line-height: 1.15;
        font-weight: 700;
      }

      .content-section p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.75;
        color: var(--text);
        white-space: pre-wrap;
      }

      .toc h2 {
        margin: 0 0 10px;
        font-size: 1rem;
        font-weight: 400;
      }

      .toc-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .toc-list li {
        margin: 0;
      }

      .toc-link {
        display: block;
        padding: 4px 0 4px 10px;
        border-left: 2px solid transparent;
        color: var(--muted);
        line-height: 1.2;
        cursor: pointer;
      }

      .toc-link:hover {
        color: var(--accent);
      }

      .toc-link.active {
        border-left-color: var(--accent-strong);
        color: #1c5fda;
      }

      .toc-link .toc-number {
        display: inline-block;
        min-width: 34px;
      }

      .toc-caption {
        margin-top: 18px;
        color: var(--faint);
        font-size: 0.86rem;
        line-height: 1.5;
      }

      .empty-note {
        margin-top: 14px;
        color: var(--faint);
        font-size: 0.9rem;
        line-height: 1.5;
      }
    </style>
</head>

      let content = JSON.parse(dataJSON);
      
      const state = {
        section: "chapter_1",
        item: null,
        query: ""
      };

      // Initialize
      if (content[state.section]) {
        state.item = content[state.section].items[0].id;
      }

      const sectionNav = document.getElementById("sectionNav");
      const itemNav = document.getElementById("itemNav");
      const tocSearch = document.getElementById("tocSearch");
      const articleEyebrow = document.getElementById("articleEyebrow");
      const articleTitle = document.getElementById("articleTitle");
      const articleLede = document.getElementById("articleLede");
      const sectionOneTitle = document.getElementById("sectionOneTitle");
      const sectionOneBody = document.getElementById("sectionOneBody");
      const sectionTwoTitle = document.getElementById("sectionTwoTitle");
      const sectionTwoBody = document.getElementById("sectionTwoBody");

      function currentSection() {
        return content[state.section];
      }

      function filteredItems() {
        const query = state.query.trim().toLowerCase();
        const items = currentSection().items;
        if (!query) {
          return items;
        }
        return items.filter((item) => item.title.toLowerCase().includes(query));
      }

      function currentItem() {
        const visibleItems = filteredItems();
        const match = visibleItems.find((item) => item.id === state.item);
        return match || visibleItems[0] || currentSection().items[0];
      }

      function renderSectionNav() {
        const sections = Object.keys(content).sort((a, b) => {
          return parseInt(content[a].number) - parseInt(content[b].number);
        });

        sectionNav.innerHTML = sections.map(key => {
          const section = content[key];
          const active = key === state.section ? " active" : "";
          return '<a class="section-link' + active + '" href="#" data-section="' + key + '"><span class="number">' + section.number + '</span>' + section.label + '</a>';
        }).join("");

        sectionNav.querySelectorAll("[data-section]").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            const nextSection = event.currentTarget.dataset.section;
            state.section = nextSection;
            state.query = "";
            tocSearch.value = "";
            state.item = content[nextSection].items[0].id;
            render();
          });
        });
      }

      function renderItemNav() {
        const items = filteredItems();

        if (!items.length) {
          itemNav.innerHTML = '<li class="empty-note">No matches in this section.</li>';
          return;
        }

        itemNav.innerHTML = items.map((item) => {
          const active = item.id === state.item ? " active" : "";
          return '<li><a class="toc-link' + active + '" href="#" data-item="' + item.id + '"><span class="toc-number">' + item.number + '</span>' + item.title + '</a></li>';
        }).join("");

        itemNav.querySelectorAll("[data-item]").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            state.item = event.currentTarget.dataset.item;
            render();
          });
        });
      }

      function renderArticle() {
        const section = currentSection();
        const item = currentItem();
        state.item = item.id;

        articleEyebrow.textContent = section.number + '. ' + section.label;
        articleTitle.textContent = item.title;
        articleLede.textContent = item.lede;

        sectionOneTitle.textContent = item.sectionOneTitle;
        sectionOneBody.textContent = item.sectionOneBody;
        sectionTwoTitle.textContent = item.sectionTwoTitle;
        sectionTwoBody.textContent = item.sectionTwoBody;
      }

      function render() {
        renderSectionNav();
        renderItemNav();
        renderArticle();
      }

      tocSearch.addEventListener("input", (event) => {
        state.query = event.target.value;
        const visible = filteredItems();
        if (visible.length && !visible.some((item) => item.id === state.item)) {
          state.item = visible[0].id;
        }
        renderItemNav();
        renderArticle();
      });

      // Initial render
      render();
    </script>
